<script>
(function(){
/* ================= 기본 ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let TODAY=iso(new Date()),T0=new Date(TODAY+'T00:00:00');
const WD=['일','월','화','수','목','금','토'];
const dt=s=>new Date(String(s).slice(0,10)+'T00:00:00');
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((dt(s)-T0)/864e5);
const md=s=>{if(!s)return '';const d=dt(s);if(isNaN(d))return s;return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const ddL=n=>n===0?'D-day':n>0?'D-'+n:'D+'+(-n);
const ddC=n=>n<=1?'urgent':n<=3?'warn':'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KIND={due:['📝','서류 마감'],sub:['📤','제출'],apt:['🧠','인적성·AI역량'],int:['🎤','면접'],ann:['📢','결과 발표'],etc:['•','기타']};
const COLS=[['관심','시작 전','--st-start'],['작성중','작성 중','--st-write'],['제출','제출','--st-sub'],['인적성','인적성·필기','--st-test'],['면접1','1차 면접','--st-int'],['면접2','2차 면접','--st-int'],['면접3','3차 면접','--st-int'],['종료','종료','--st-end']];
const PROC=['인적성','면접1','면접2','면접3'];
const isProc=p=>PROC.includes(p.stage);
function stageOfStep(s){s=String(s||'');if(/1차/.test(s))return '면접1';if(/2차/.test(s))return '면접2';if(/3차|최종|임원/.test(s))return '면접3';if(/인적성|필기|AI|역량|SKCT|코딩|TEST|테스트|과제|검사/i.test(s))return '인적성';if(/면접|인터뷰/.test(s))return '면접1';return '인적성'}
function stepIdxFor(p,st){const i=p.steps.findIndex((s,j)=>j>0&&stageOfStep(s)===st);return i}
const COLNAME=Object.fromEntries(COLS.map(c=>[c[0],c[1]]));
const RESULTS=['최종합격','불합격','포기/무응답','인재풀'];
const DUEKIND=[['확정','확정 (일시 있음)'],['채용시','채용 시 마감'],['미확인','미확인']];
const TYPES=['체험형','전환형','정규직','계약직'];
const HOT_DAYS=3; /* 마감 임박 기준 (홈·달력 공통) */
/* 업권 선택지: 사람마다 따로 (설정 'inds'). 지금 공고에 쓰인 값이 목록에 없으면 같이 보여 줌 */
const indsOf=(w,cur)=>{const l=[...((DB[w]&&DB[w].inds)||INDS)];(Array.isArray(cur)?cur:[cur]).forEach(c=>{if(c&&!l.includes(c))l.push(c)});return l};
const INDS=['은행','증권','자산운용','저축은행','캐피탈/카드','보험','공기업','일반기업','기타'];
const BASEJOBS=['제품영업','솔루션영업','기술영업','금융영업','사업개발','자산운용','리스크/심사'];
const QST=['미작성','초안','제출본'];
const DEFAULT_AUTO={q:true,pre:true,res:true,recheck:true};
let NAMES={};/* 플래너 id → 이름 (서버가 알려 줌) */
const GOOGLE_CLIENT_ID='405546328317-siu1ah5girrbl1o2us9rtls4eafpn8eh.apps.googleusercontent.com';/* 공개 값 */
const DEFAULT_SERVER='https://script.google.com/macros/s/AKfycbxpOGnj0TBYyWTAGF3CcUr-0ozCYzf6fIAUO87M5jZ-R2T9gB-10v3gAQ7_90mrlRoG/exec';
/* 권한: 주인 > 전체 허용 > 편집 허용 > 댓글 허용 > 읽기 허용 (노션과 같음) */
const RANK={read:1,comment:2,edit:3,full:4,owner:5};
const ROLES=[['full','전체 허용','편집하고 댓글을 달고 다른 사람에게 공유할 수 있어요'],['edit','편집 허용','편집, 댓글 달기'],['comment','댓글 허용','자소서 문장·공고에 댓글 달기'],['read','읽기 허용','보기만 할 수 있어요']];
const ROLE_NAME=Object.assign({owner:'주인'},Object.fromEntries(ROLES.map(r=>[r[0],r[1]])));
const ICON={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>',
  rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};
const VIEWS=[['cal','달력','cal'],['home','홈','home'],['board','보드','board'],['rec','분석','rec'],['list','기록','list']];

/* ================= 기기 저장 ================= */
/* 기기 저장 이름표 jpl_ : 같은 주소(github.io)의 지금 쓰는 앱(jp_)과 섞이지 않게 */
const LS={get(k,d){try{const v=localStorage.getItem('jpl_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('jpl_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('jpl_'+k)}catch(e){}}};
const cfg=Object.assign({server:'',sess:'',email:''},LS.get('cfg',{}));
if(!cfg.server&&!/^__/.test(DEFAULT_SERVER))cfg.server=DEFAULT_SERVER;
(function(){/* 시험용: 링크의 #s= 로 다른 서버 주소를 줄 수 있음 */
  const m=location.hash.match(/(?:^#|&)s=([^&]+)/)||location.search.match(/[?&]s=([^&]+)/);
  if(m){try{cfg.server=decodeURIComponent(m[1]);LS.set('cfg',cfg)}catch(e){}}
})();
const saveCfg=()=>LS.set('cfg',cfg);

/* ================= 데이터 ================= */
const emptyPerson=w=>({name:NAMES[w]||'',jobs:[...BASEJOBS],inds:[...INDS],auto:{...DEFAULT_AUTO},tasks:[],posts:[]});
const DB={};/* 플래너 id → 데이터. 내가 볼 수 있는 플래너만 들어 있음 */
let META={email:'',me:'',names:{},planners:[]};/* planners: [{id,name,owner,role,shares:[{email,role,name}]}] */
let loaded=false,usage=Object.assign({used:0,limit:30,hasKey:null},LS.get('usage',{})),sheets={};/* hasKey: null=아직 모름(막지 않음), false=서버가 없다고 함 */
const Y=b=>b?'Y':'';
function build(w,t){
  const P0=emptyPerson(w);if(!t)return P0;
  const posts=(t.posts||[]).map(r=>({id:r.id,co:r.co||'',job:r.job||'',role:r.role||'',type:r.type||'',ind:r.ind||'',loc:r.loc||'',link:r.link||'',relLink:r.relLink||'',
    short:r.short||'',applyStart:r.applyStart||'',dueKind:r.dueKind||'미확인',due:r.due||null,recheck:r.recheck||'',stage:r.stage||'관심',result:r.result||'',failAt:r.failAt||'',submitted:r.submitted||'',
    steps:(r.steps||'서류').split('>').map(s=>s.trim()).filter(Boolean),cur:+r.cur||0,memo:r.memo||'',src:r.src||'',created:r.created||'',updated:r.updated||'',qs:[],tasks:[],events:[],hist:[],comments:[]}));
  const by=Object.fromEntries(posts.map(p=>[p.id,p]));
  (t.qs||[]).slice().sort((a,b)=>(+a.i)-(+b.i)).forEach(r=>{const p=by[r.pid];if(p)p.qs.push({id:r.id,t:r.t||'',n:+r.n||0,a:r.a||'',st:r.st||'미작성',lock:r.lock==='Y',ver:r.ver||''})});
  (t.events||[]).forEach(r=>{const p=by[r.pid];if(p)p.events.push({id:r.id,d:r.d,k:r.k||'etc',t:r.t||''})});
  (t.tasks||[]).forEach(r=>{const o={id:r.id,t:r.t||'',due:r.due||'',done:r.done==='Y',doneAt:r.doneAt||'',auto:r.auto==='Y'};if(r.pid&&by[r.pid])by[r.pid].tasks.push(o);else P0.tasks.push(o)});
  (t.hist||[]).forEach(r=>{const p=by[r.pid];if(p)p.hist.push({id:r.id,d:r.d,t:r.t})});
  (t.comments||[]).forEach(r=>{const p=by[r.pid];if(!p)return;let rep=[];try{rep=JSON.parse(r.replies||'[]')}catch(e){}
    p.comments.push({id:r.id,qi:r.qi===''?-1:+r.qi,quote:r.quote||'',text:r.text||'',by:r.by||'',at:r.at||'',replies:rep,resolved:r.resolved==='Y',read:r.read==='Y',ver:r.ver||''})});
  posts.forEach(p=>{if(p.stage==='전형'||!COLNAME[p.stage])p.stage=p.stage==='전형'?stageOfStep(p.steps[p.cur]):'관심'});
  posts.forEach(p=>{p.hist.sort((a,b)=>String(a.d).localeCompare(String(b.d)));if(!p.hist.length)p.hist=[{id:uid(),d:p.created||TODAY,t:'등록'}]});
  (t.settings||[]).forEach(r=>{try{if(r.k==='jobs')P0.jobs=JSON.parse(r.v);if(r.k==='inds')P0.inds=JSON.parse(r.v);if(r.k==='auto')P0.auto=Object.assign({...DEFAULT_AUTO},JSON.parse(r.v))}catch(e){}});
  posts.forEach(p=>{const r=(t.posts||[]).find(x=>x.id===p.id);p._rev=(r&&r.rev)||'';p._snap=snapOf(p)});
  P0.posts=posts;P0._gsnap={};P0.tasks.forEach(x=>{P0._gsnap[x.id]=JSON.stringify(gRow(x))});return P0;
}
function setData(data,meta){
  if(meta){META=meta;NAMES=Object.assign({},meta.names||{});(meta.planners||[]).forEach(p=>{NAMES[p.id]=p.name})}
  Object.keys(DB).forEach(k=>{if(!META.planners.some(p=>p.id===k))delete DB[k]});
  META.planners.forEach(pl=>{DB[pl.id]=DB[pl.id]||emptyPerson(pl.id);Object.assign(DB[pl.id],build(pl.id,(data||{})[pl.id]))});loaded=true}
const postRow=p=>({id:p.id,co:p.co,job:p.job,role:p.role,type:p.type,ind:p.ind,loc:p.loc,link:p.link,relLink:p.relLink,applyStart:p.applyStart,dueKind:p.dueKind,due:p.due||'',recheck:p.recheck,
  stage:p.stage,result:p.result,failAt:p.failAt,submitted:p.submitted,steps:p.steps.join(' > '),cur:p.cur,memo:p.memo,short:p.short||'',src:p.src||'',created:p.created||TODAY,updated:new Date().toISOString().slice(0,16)});
const cRow=(p,c)=>({id:c.id,pid:p.id,qi:c.qi<0?'':c.qi,quote:c.quote,text:c.text,by:c.by,at:c.at,replies:JSON.stringify(c.replies||[]),resolved:Y(c.resolved),read:Y(c.read),ver:c.ver||''});
/* 저장 규칙 (2026-11-21)
   ① 바뀐 줄만 저장: 불러올 때 찍어 둔 사진(_snap)과 비교해서 바뀐 일정·할 일·문항만 올리고, 내가 지운 것만 지움
      → 오래된 화면이 저장해도 다른 기기에서 넣은 일정을 지우지 않음
   ② 다른 기기 변경 감지: 공고마다 수정번호(rev). 내가 본 뒤 서버에서 바뀌었으면 서버가 저장을 거절 → 새로 불러옴 */
function ensureIds(p){p.qs.forEach(q=>{if(!q.id)q.id=uid()});p.events.forEach(e=>{if(!e.id)e.id=uid()});p.tasks.forEach(t=>{if(!t.id)t.id=uid()});p.hist.forEach(h=>{if(!h.id)h.id=uid()})}
const childRows=p=>({
  qs:p.qs.map((q,i)=>({id:q.id,pid:p.id,i,t:q.t,n:q.n,a:q.a,st:q.st,lock:Y(q.lock),ver:q.ver||''})),
  events:p.events.map(e=>({id:e.id,pid:p.id,d:e.d,k:e.k,t:e.t})),
  tasks:p.tasks.map(t=>({id:t.id,pid:p.id,t:t.t,due:t.due,done:Y(t.done),doneAt:t.doneAt||'',auto:Y(t.auto)})),
  hist:p.hist.map(h=>({id:h.id,pid:p.id,d:h.d,t:h.t}))});
const postCore=p=>{const r=postRow(p);delete r.updated;return r};
function snapOf(p){ensureIds(p);const c=childRows(p),s={post:JSON.stringify(postCore(p))};Object.keys(c).forEach(t=>{s[t]={};c[t].forEach(r=>{s[t][r.id]=JSON.stringify(r)})});return s}
function bundleOps(p){
  ensureIds(p);const S0=p._snap||{post:'',qs:{},events:{},tasks:{},hist:{}},c=childRows(p),ops=[];let changed=JSON.stringify(postCore(p))!==S0.post;
  Object.keys(c).forEach(t=>{const now=new Set(),up=[];
    c[t].forEach(r=>{now.add(r.id);if(S0[t][r.id]!==JSON.stringify(r))up.push(r)});
    if(up.length){ops.push({op:'upsert',table:t,rows:up});changed=true}
    Object.keys(S0[t]).forEach(id=>{if(!now.has(id)){ops.push({op:'remove',table:t,key:'id',value:id});changed=true}})});
  if(!changed)return {ops:[]};
  const unit='p:'+p.id,snapNow=snapOf(p);
  const all=[{op:'check',table:'posts',id:p.id,rev:p._rev||''},{op:'upsert',table:'posts',rows:[postRow(p)]},...ops].map(o=>Object.assign(o,{unit}));
  return {ops:all,done:revs=>{p._snap=snapNow;if(revs&&revs[p.id])p._rev=revs[p.id]}};
}
function gSnap(w){const s={};DB[w].tasks.forEach(t=>{if(!t.id)t.id=uid();s[t.id]=JSON.stringify(gRow(t))});return s}
const gRow=t=>({id:t.id,pid:'',t:t.t,due:t.due,done:Y(t.done),doneAt:t.doneAt||'',auto:Y(t.auto)});

/* ================= 서버 통신 · 저장 줄 ================= */
async function api(action,body){
  if(!cfg.server)throw {code:'no_server'};
  let res;
  try{res=await fetch(cfg.server,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({sess:cfg.sess,action},body||{}))})}
  catch(e){throw {code:'network'}}
  let j;try{j=await res.json()}catch(e){throw {code:'bad_response'}}
  if(!j.ok&&j.error==='auth'&&action!=='login'){logout(true);throw {code:'auth'}}
  if(!j.ok)throw {code:j.error||'error',detail:j.detail,usage:j.usage};
  return j;
}
const queue=new Map();let saving=false,saveErr=false,timer=null;
function enqueue(key,w,opsFn){queue.set(key,{w,opsFn});saveErr=false;showSync();clearTimeout(timer);timer=setTimeout(flush,500)}
let reloadAfter=false;
async function flush(){
  if(saving||!queue.size)return;saving=true;showSync();
  const items=[...queue.entries()];queue.clear();
  const byW={},dones=[];
  items.forEach(([k,it])=>{const r=it.opsFn();const ops=Array.isArray(r)?r:(r.ops||[]);(byW[it.w]=byW[it.w]||[]).push(...ops);if(r.done)dones.push({k,done:r.done})});
  try{let conf=[],revs={};
    for(const w of Object.keys(byW))if(byW[w].length){const j=await api('batch',{pid:w,ops:byW[w]});conf=conf.concat(j.conflicts||[]);Object.assign(revs,j.revs||{})}
    dones.forEach(d=>{if(!conf.includes(d.k))d.done(revs)});if(conf.length)reloadAfter=true;cacheData()}
  catch(e){if(e&&e.code==='auth'){saving=false;return}if(e&&e.code==='forbidden'){toast('이 플래너를 고칠 권한이 없어요. 새로 불러올게요');saving=false;refresh(true);return}
    saveErr=true;items.forEach(([k,it])=>{if(!queue.has(k))queue.set(k,it)})}
  saving=false;showSync();
  if(queue.size&&!saveErr){flush();return}
  if(reloadAfter&&!queue.size){reloadAfter=false;await refresh(true);toast('다른 기기에서 바뀐 공고가 있어서 새로 불러왔어요. 방금 한 수정은 다시 해 주세요')}
}
function showSync(){const el=document.getElementById('sync');if(!el)return;
  if(saveErr){el.innerHTML='<button class="link-btn small" data-act="retry" style="color:var(--urgent)">저장 실패 · 다시 시도</button>';return}
  el.textContent=saving||queue.size?'저장 중…':'';}
const dirty=p=>{if(!p)return;const w=owner(p);enqueue('p:'+p.id,w,()=>bundleOps(p))};
const dirtyC=(p,c)=>{const w=owner(p);enqueue('c:'+c.id,w,()=>[{op:'upsert',table:'comments',rows:[cRow(p,c)]}])};
const dirtyG=w=>{enqueue('g:'+w,w,()=>{const S0=DB[w]._gsnap||{},now=gSnap(w),ops=[];const up=DB[w].tasks.filter(t=>S0[t.id]!==now[t.id]).map(gRow);

  }

  return `<div class="cal-side">${h}</div>`;
}

/* ================= S7 기록 ================= */
const recDate=p=>p.submitted||String(p.due||'').slice(0,10)||p.created||'';
function inRange(p){const d=recDate(p);if(!S.recFrom&&!S.recTo)return true;if(!d)return false;return (!S.recFrom||d>=S.recFrom)&&(!S.recTo||d<=S.recTo)}
function recPreset(v){const t=dt(TODAY);S.recPreset=v;
  if(v==='all'){S.recFrom='';S.recTo=''}
  else if(v==='month'){S.recFrom=iso(new Date(t.getFullYear(),t.getMonth(),1));S.recTo=iso(new Date(t.getFullYear(),t.getMonth()+1,0))}
  else if(v==='3m'){S.recFrom=addDays(TODAY,-90);S.recTo=TODAY}
  else if(v==='year'){S.recFrom=t.getFullYear()+'-01-01';S.recTo=t.getFullYear()+'-12-31'}}
const jobKey=p=>p.job||'(미분류)',indKey=p=>p.ind||'(미분류)';
const isSub=p=>!!(p.submitted||(p.stage==='종료'&&p.result!=='포기/무응답'));
function recPass(p,skip){return inRange(p)&&(skip==='job'||!S.fJobs.length||S.fJobs.includes(jobKey(p)))&&(skip==='ind'||!S.fInds.length||S.fInds.includes(indKey(p)))}

/* ================= 기록: 전체 공고 표 (노션 표 보기처럼) ================= */
function LF0(){return {stage:'',type:'',res:'',ind:[],job:[],from:'',to:'',sub:false,fail:''}}
const STORD=Object.fromEntries(COLS.map((c,i)=>[c[0],i]));
function listPass(p){const f=S.lf,q=S.lq.trim().toLowerCase();
  if(q&&!(p.co+' '+p.role+' '+p.ind+' '+p.job+' '+p.type).toLowerCase().includes(q))return false;
  if(f.stage==='진행'&&p.stage==='종료')return false;
  if(f.stage==='제출전'&&!isOpen(p))return false;
  if(f.stage&&f.stage!=='진행'&&f.stage!=='제출전'&&p.stage!==f.stage)return false;
  if(f.type&&(p.type||'(미분류)')!==f.type)return false;
  if(f.res&&!(p.stage==='종료'&&p.result===f.res))return false;
  if(f.fail&&p.failAt!==f.fail)return false;
  if(f.ind.length&&!f.ind.includes(indKey(p)))return false;
  if(f.job.length&&!f.job.includes(jobKey(p)))return false;
  if(f.sub&&!isSub(p))return false;
  if(f.from||f.to){const d=recDate(p);if(!d||(f.from&&d<f.from)||(f.to&&d>f.to))return false}
  return true}
function listSorted(){const k=S.lSort,dir=S.lDir;
  const val=p=>k==='co'?shortCo(p.co):k==='stage'?STORD[p.stage]:k==='due'?(p.dueKind==='확정'&&p.due)||'':k==='sub'?p.submitted||'':recDate(p);
  return vis(S.who).filter(listPass).sort((a,b)=>{const x=val(a),y=val(b);
    if(x===''&&y!=='')return 1;if(y===''&&x!=='')return -1;
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'ko'))*dir})}
function stagePill(p){if(p.stage==='종료')return resPill(p);const c=COLS.find(c=>c[0]===p.stage);return `<span class="stg"><i class="dot" style="--c:var(${c?c[2]:'--st-start'})"></i>${esc(COLNAME[p.stage]||p.stage)}</span>`}

/* ================= S4 공고 상세 ================= */
function stepsH(p){const fi=p.stage==='종료'&&p.failAt?p.steps.indexOf(p.failAt):-1;
  return p.steps.map((s,i)=>{let c='';if(p.stage==='종료'){if(p.result==='최종합격'||i<fi)c='done';else if(i===fi)c='fail'}else{if(i<p.cur)c='done';else if(i===p.cur)c='now'}
    return (i?'<span class="arrow">→</span>':'')+`<span class="step ${c}">${c==='done'?'✔ ':c==='fail'?'✕ ':''}${esc(s)}</span>`}).join('')}
function hl(text,cs){
  let h=esc(text);const lost=[],placed=[],keys=[],byQ={};
  cs.filter(c=>c.quote&&!c.resolved).forEach(c=>{const q=esc(c.quote);
    if(byQ[q]){byQ[q].push(c.id);placed.push(c.id);return}
    const i=h.indexOf(q);if(i<0){lost.push(c.id);return}
    const seg=h.slice(i,i+q.length);if(h.lastIndexOf('<mark',i)>h.lastIndexOf('</mark>',i)||seg.includes('<mark')||seg.includes('</mark>'))return;
    byQ[q]=[c.id];placed.push(c.id);keys.push(q);
    h=h.slice(0,i)+`<mark data-act="pin-c" data-cs="§${keys.length-1}§">${q}</mark>`+h.slice(i+q.length)});
  h=h.replace(/§(\d+)§/g,(m,n)=>byQ[keys[+n]].join(' '));
  h=h.replace(/\n/g,'\n<i class="pg"></i>');/* 문단 사이 간격 */
  return {h,lost,placed};
}
function cmtH(p,c,lostIds){
  return `<div class="cmt ${c.resolved?'res':''} ${S.flash===c.id?'flash':''}" id="c-${c.id}">
   <div><span class="who">${esc(nm(c.by)||c.by||'노션')}</span> <span class="muted small">${md(c.at)}${c.ver?` · ${esc(c.ver)}에 단 댓글`:''}</span>${c.resolved?' <span class="pill mute">해결</span>':''}</div>
   ${c.quote?`<div class="q-quote">“${esc(c.quote)}”${lostIds.includes(c.id)?' <span class="lost">· 원래 문장 (지금은 수정됨)</span>':''}</div>`:''}
   <div style="white-space:pre-wrap">${esc(c.text)}</div>
   ${c.replies.map(r=>`<div class="rep"><span class="who">${esc(nm(r.by)||r.by)}</span> ${esc(r.text)}</div>`).join('')}
   ${S.replyTo===c.id?`<div class="inline"><input type="text" id="rTxt" placeholder="답글 입력"><button class="btn sm" data-act="reply-ok" data-c="${c.id}">등록</button></div>`:''}
   ${canComment(owner(p))?`<div class="acts2"><button class="link-btn small" data-act="reply" data-c="${c.id}">답글</button><button class="link-btn small" data-act="resolve" data-c="${c.id}">${c.resolved?'다시 열기':'해결'}</button></div>`:''}</div>`;
}
function cmtList(p,cs,lostIds,key){
  const open=cs.filter(c=>!c.resolved),done=cs.filter(c=>c.resolved);
  return `<div class="cmts">${open.map(c=>cmtH(p,c,lostIds)).join('')}${done.length?`<button class="link-btn small" style="align-self:flex-start" data-act="show-res" data-v="${key}">${S.showRes[key]?'▾':'▸'} 해결된 댓글 ${done.length}개</button>${S.showRes[key]?done.map(c=>cmtH(p,c,lostIds)).join(''):''}`:''}</div>`;
}
function qCmts(p,cs,lost,placed,key){
  const open=cs.filter(c=>!c.resolved),rest=open.filter(c=>!placed.includes(c.id)),done=cs.filter(c=>c.resolved);
  return `<div class="cbar">${placed.length?`💬 ${placed.length} · 형광펜에 ${narrow()?'눌러서':'마우스를 올려서'} 보기`:''}</div>`+
    (rest.length||done.length?`<div class="cmts">${rest.map(c=>cmtH(p,c,lost)).join('')}${done.length?`<button class="link-btn small" style="align-self:flex-start" data-act="show-res" data-v="${key}">${S.showRes[key]?'▾':'▸'} 해결된 댓글 ${done.length}개</button>${S.showRes[key]?done.map(c=>cmtH(p,c,lost)).join(''):''}`:''}</div>`:'');

function setStage(p,st){
  if(st===p.stage){S.dlg=null;renderLayer();return}
  if(st==='종료'){resultDlg(p.id);return}
  const b=snap(p),old=p.stage;p.stage=st;p.result='';p.failAt='';
  if(st==='제출'&&!p.submitted)p.submitted=TODAY;
  if(st==='관심'||st==='작성중'){p.submitted='';p.cur=0}
  if(PROC.includes(st)){const i=stepIdxFor(p,st);if(i>0)p.cur=i;else if(p.cur<1)p.cur=1;if(!p.submitted)p.submitted=TODAY}
  const nt=p.tasks.length;ensureAuto(p);const added=p.tasks.length-nt;
  hist(p,`${COLNAME[old]} → ${COLNAME[st]}`);S.dlg=null;changed(p,b,`${shortCo(p.co)} → ${COLNAME[st]}${added?` · 자동 할 일 ${added}개`:''}`);
}

/* 캡처 다듬기: 폭은 최대 1200px로 맞추고, 세로로 긴 캡처는 줄이지 않고 위에서부터 잘라 여러 장으로
   (통째로 줄이면 글자가 뭉개져서 못 읽음). 잘린 경계의 글자를 위해 조금씩 겹치게 자름 */
const MAX_IMGS=20;
function tiles(dataUrl){return new Promise(res=>{const img=new Image();img.onload=()=>{
  const W=Math.min(img.width,1200),sc=W/img.width,H=Math.round(img.height*sc);
  const T=Math.floor(1150000/W),OV=60,out=[];
  for(let y=0;y<H;y+=T-OV){const h=Math.min(T,H-y);const c=document.createElement('canvas');c.width=W;c.height=h;
    c.getContext('2d').drawImage(img,0,y/sc,img.width,h/sc,0,0,W,h);out.push(c.toDataURL('image/jpeg',0.88));if(y+h>=H)break}
  res(out)};img.onerror=()=>res([dataUrl]);img.src=dataUrl})}
const isUrl=s=>/^https?:\/\/\S+$/i.test(String(s||'').trim());
/* 이미지 주소: 서버가 그림을 받아 오면 캡처처럼 잘라서 넣음 (긴 공고 이미지도 글자 크기 유지).
   서버가 못 받으면 주소 그대로 두고 Claude가 직접 받아 보게 함 */
async function addImgUrl(u){u=String(u||'').trim();const A=S.add;if(!A)return;if(!isUrl(u)){toast('https:// 로 시작하는 이미지 주소를 넣어 주세요');return}
  A.imgUrls=A.imgUrls||[];if(A.imgs.length+A.imgUrls.length>=MAX_IMGS){toast(`이미지는 ${MAX_IMGS}장까지 넣을 수 있어요`);return}
  A.warn='이미지 가져오는 중…';addDlg();
  try{const j=await api('fetchImg',{url:u});if(S.add!==A)return;const ts=await tiles(`data:${j.type};base64,${j.data}`);let cut=false;
    for(const t of ts){if(A.imgs.length+A.imgUrls.length>=MAX_IMGS){cut=true;break}A.imgs.push(t)}
    A.warn=cut?`이미지가 길어서 앞부분 ${MAX_IMGS}조각까지만 넣었어요`:''}
  catch(e){if(S.add!==A)return;if(!A.imgUrls.includes(u))A.imgUrls.push(u);A.warn='서버가 그림을 직접 못 받아서 주소로 넣어 뒀어요. 안 되면 캡처로 올려 주세요'}
  addDlg()}
async function pasteClip(){/* 휴대폰: 클립보드 읽기 (사파리는 [붙여넣기] 말풍선이 한 번 뜸) */
  try{if(!navigator.clipboard||!navigator.clipboard.read)throw 0;const items=await navigator.clipboard.read();const fs=[];let txt='';
    for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const bl=await it.getType(t);fs.push(new File([bl],'clip',{type:t}))}else if(it.types.includes('text/plain')){txt=await (await it.getType('text/plain')).text()}}
    if(fs.length)addFiles(fs);else if(isUrl(txt))addImgUrl(txt);else toast('복사한 이미지가 없어요')}
  catch(e){toast('이 기기에선 바로 못 읽어요. 아래 칸을 길게 눌러 [붙여넣기] 해 주세요')}}
function addFiles(files){const fs=[...files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;let left=fs.length,cut=false;
  fs.forEach(f=>{const r=new FileReader();r.onload=async()=>{const ts=await tiles(r.result);
    for(const t of ts){if(S.add.imgs.length+(S.add.imgUrls||[]).length>=MAX_IMGS){cut=true;break}S.add.imgs.push(t)}
    if(--left===0){S.add.warn=cut?`캡처가 길어서 앞부분 ${MAX_IMGS}조각까지만 넣었어요. 필요한 부분만 다시 캡처해 주세요`:'';addDlg()}};r.readAsDataURL(f)})}

function fitCells(){document.querySelectorAll('.cal.fill .cell').forEach(c=>{
  c.querySelectorAll('.more').forEach(m=>m.remove());const evs=[...c.querySelectorAll('.ev')];evs.forEach(e=>e.hidden=false);if(!evs.length)return;
  const H=c.clientHeight;const fits=e=>e.offsetTop+e.offsetHeight<=H-2;if(fits(evs[evs.length-1]))return;
  let k=evs.length;while(k>0&&!fits(evs[k-1]))k--;k=Math.max(0,k-1);
  evs.slice(k).forEach(e=>e.hidden=true);const m=document.createElement('span');m.className='ev muted more';m.textContent='+'+(evs.length-k);c.appendChild(m)})}

    case 'sh-add':shareAdd(t.dataset.pid);break;
    case 'sh-menu':S.shMenu=S.shMenu===t.dataset.em?null:t.dataset.em;renderLayer();break;
    case 'sh-set':setRole(t.dataset.pid,t.dataset.em,v);break;
    case 'logout':logout(false);break;
    case 'recheck':recheck();break;
    case 'members':membersDlg();break;
    case 'mem-set':memSet(t.dataset.em,v);break;
    case 'nav':S.view=v;S.open=null;S.dlg=null;render();break;
    case 'open':S.open=id;S.ed=null;S.delAsk=false;S.editQ=null;S.flash=null;S.replyTo=null;{const q=find(id);if(q)markRead(q)}render();break;
    case 'open-c':S.open=id;S.flash=t.dataset.c;S.editQ=null;{const q=find(id);if(q)markRead(q)}render();break;
    case 'close':S.open=null;S.ed=null;S.delAsk=false;S.editQ=null;S.flash=null;hidePop();render();break;
    case 'dlg-close':closeDlg();break;

    case 'undo':if(S.undo){const q=find(S.undo.id);if(q){restore(q,S.undo.before);dirty(q)}S.undo=null;render();toast('되돌렸어요')}break;
    case 'stage-menu':stageMenu(id);break;
    case 'set-stage':setStage(find(id),v);break;
    case 'res-ok':{const q=find(id),b=snap(q);const r=(document.querySelector('input[name=res]:checked')||{}).value||'불합격';const old=q.stage;q.stage='종료';q.result=r;
      q.failAt=(r==='불합격'||r==='포기/무응답')?$('#failAt').value:'';if(r==='최종합격')q.cur=q.steps.length;hist(q,`${COLNAME[old]} → 종료 (${r}${q.failAt?' · '+q.failAt:''})`);S.dlg=null;S.endOpen[r]=true;changed(q,b,`${shortCo(q.co)} → 종료 (${r})`);break}

    case 'od-ext':{const q=find(id);S.open=id;edStart(q,true);render();break}
    case 'od-drop':{const q=find(id),b=snap(q);const old=q.stage;q.stage='종료';q.result='포기/무응답';q.failAt=q.steps[0]||'서류';hist(q,`${COLNAME[old]} → 종료 (포기 · 마감 지남)`);changed(q,b,`${shortCo(q.co)} → 포기`);break}
    case 'submit-done':if(p)setStage(p,'제출');break;
    case 'step-menu':if(p)stepDlg(p);break;
    case 'step-ok':if(p){const i=+((document.querySelector('input[name=stp]:checked')||{}).value||p.cur);const b=snap(p);p.cur=i;
      if(i>0){const o=p.stage,ns=stageOfStep(p.steps[i]);p.stage=ns;if(!p.submitted)p.submitted=TODAY;hist(p,o===ns?`현재 전형: ${p.steps[i]}`:`${COLNAME[o]} → ${COLNAME[ns]} (${p.steps[i]})`)}else hist(p,`현재 전형: ${p.steps[i]}`);
      S.dlg=null;changed(p,b,`${shortCo(p.co)} · 현재 전형: ${p.steps[i]}`)}break;

    case 'ed-save':edSave();break;

    case 'unlock':if(p){p.qs[+t.dataset.i].lock=false;dirty(p);renderLayer();toast('잠금을 풀었어요. 다 고치면 다시 제출본으로 바꿔 주세요')}break;
    case 'pin-c':showPop(t,true);break;
    case 'pop-close':hidePop();break;
    case 'sel-c':if(p&&S.sel&&canComment(owner(p)))commentDlg(p,S.sel.qi,S.sel.quote);break;
    case 'c-ok':if(p&&S.sel&&canComment(owner(p))){const x=$('#cTxt').value.trim();if(!x){toast('댓글 내용을 적어 주세요');break}const c={id:uid(),qi:S.sel.qi,quote:S.sel.quote,text:x,by:S.me,at:TODAY,replies:[],resolved:false,read:mine(p),ver:((p.qs[S.sel.qi]||{}).ver||'').split(' · ')[0]};p.comments.push(c);dirtyC(p,c);S.sel=null;S.dlg=null;S.flash=c.id;render();toast(mine(p)?'댓글을 달았어요':`${nm(owner(p))} 님에게 댓글을 남겼어요`)}break;
    case 'add-pc':if(p&&canComment(owner(p))){const x=$('#pcTxt').value.trim();if(!x){toast('내용을 적어 주세요');break}const c={id:uid(),qi:-1,quote:'',text:x,by:S.me,at:TODAY,replies:[],resolved:false,read:mine(p)};p.comments.push(c);dirtyC(p,c);render();toast('댓글을 남겼어요')}break;
    case 'reply':S.replyTo=S.replyTo===t.dataset.c?null:t.dataset.c;if(t.closest('#cpop')){const pp=document.getElementById('cpop');S.pin=(pp.dataset.ids||'').split(' ')[0]||S.pin}renderLayer();{const r=$('#rTxt');if(r)r.focus()}break;
    case 'reply-ok':if(p&&canComment(owner(p))){const c=p.comments.find(x=>x.id===t.dataset.c);const x=$('#rTxt').value.trim();if(c&&x){c.replies.push({text:x,by:S.me,at:TODAY});if(owner(p)!==S.me)c.read=false;dirtyC(p,c);S.replyTo=null;render()}}break;
    case 'resolve':if(p&&canComment(owner(p))){const c=p.comments.find(x=>x.id===t.dataset.c);if(c){c.resolved=!c.resolved;dirtyC(p,c);render();toast(c.resolved?'해결로 표시했어요':'다시 열었어요')}}break;
    case 'show-res':S.showRes[v]=!S.showRes[v];renderLayer();break;
    case 'board-col':S.boardCol=v;render();break;
    case 'goto-col':S.view='board';S.boardCol=v;render();{const el=document.querySelector('.col[data-col="'+v+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'})}break;
    case 'end-toggle':S.endOpen[v]=!S.endOpen[v];$('#boardBody').innerHTML=boardBody();break;
    case 'cal-prev':case 'cal-next':{const dir=a==='cal-next'?1:-1;if(S.calMode==='week'){S.calSel=addDays(S.calSel,7*dir);const d=dt(S.calSel);S.calY=d.getFullYear();S.calM=d.getMonth()}
      else{S.calM+=dir;if(S.calM<0){S.calM=11;S.calY--}if(S.calM>11){S.calM=0;S.calY++}}render();break}
    case 'cal-today':S.calSel=TODAY;S.calY=T0.getFullYear();S.calM=T0.getMonth();render();break;
    case 'cal-day':S.calSel=v;render();break;
    case 'cal-mode':S.calMode=v;render();break;
    case 'add-ev':if(p){const d=$('#evD').value,k=$('#evK').value,x=$('#evT').value.trim();if(!d||!x){toast('날짜와 내용을 넣어 주세요');break}p.events.push({id:uid(),d,k,t:x});hist(p,`일정 추가: ${x}`);dirty(p);render();toast('일정을 추가했어요')}break;
    case 'rm-pev':if(p){p.events=p.events.filter(e=>e.id!==t.dataset.e);dirty(p);render()}break;
    case 'add-task':if(p){const x=$('#tkT').value.trim(),d=$('#tkD').value;if(!x){toast('할 일을 적어 주세요');break}p.tasks.push({id:uid(),t:x,due:d,done:false});dirty(p);render();toast('할 일을 추가했어요')}break;
    case 'rm-task':if(p){p.tasks.splice(+t.dataset.i,1);dirty(p);render()}break;
    case 'add-gtask':{const x=$('#gtT').value.trim(),d=$('#gtD').value;if(!x){toast('할 일을 적어 주세요');break}DB[S.who].tasks.push({id:uid(),t:x,due:d,done:false});dirtyG(S.who);render();toast('할 일을 추가했어요');break}
    case 'del':S.delAsk=true;renderLayer();break;
    case 'del-no':S.delAsk=false;renderLayer();break;
    case 'del-yes':if(p){const w=owner(p),L=DB[w].posts;L.splice(L.indexOf(p),1);delRemote(p,w);S.open=null;S.delAsk=false;render();toast('삭제했어요')}break;
    case 'settings':if(S.me)settingsDlg();break;
    case 'job-del':{const L=DB[S.me].jobs,i=L.indexOf(v);if(i>=0&&L.length>1){L.splice(i,1);dirtyS(S.me);settingsDlg();toast(`'${v}'를 직무 선택지에서 뺐어요 (기존 공고는 그대로)`)}break}
    case 'job-add':{const x=$('#jobNew').value.trim();if(x&&!DB[S.me].jobs.includes(x)){DB[S.me].jobs.push(x);dirtyS(S.me);settingsDlg();toast('직무를 추가했어요')}break}
    case 'add':if(ro())break;S.open=null;
      if(S.addDraft){S.add=S.addDraft;S.addDraft=null;S.add.resumed=true;if(S.add.phase==='review'&&S.add.lastForm){S.form=S.add.lastForm;formDlg()}else{S.add.phase='input';addDlg()}}
      else{S.add={tab:'link',imgs:[],imgUrls:[],link:'',text:'',warn:'',phase:'input'};addDlg()}break;
    case 'add-new':S.add={tab:'link',imgs:[],imgUrls:[],link:'',text:'',warn:'',phase:'input'};S.form=null;addDlg();break;
    case 'add-tab':readAddInputs();S.add.tab=v;S.add.warn='';addDlg();break;
    case 'clear-img':S.add.imgs=[];S.add.imgUrls=[];addDlg();break;
    case 'add-img-url':{const el=$('#aImgUrl');addImgUrl(el?el.value:'');break}
    case 'paste-clip':pasteClip();break;
    case 'pick-pos':if(S.add&&S.add.res){const r=S.add.res;reviewFrom(S.add,r.d,r.url,r.d.positions[+v])}break;
    case 'pick-all':if(S.add){S.add.showAll=!S.add.showAll;addDlg()}break;
    case 'pick-back':if(S.add){S.add.phase='input';S.add.res=null;addDlg()}break;
    case 'extract':runExtract();break;
    case 'manual':readAddInputs();S.form={mode:'manual',v:Object.assign(BLANK(),{link:S.add.link||''})};S.add.lastForm=S.form;S.add.phase='review';formDlg();break;
    case 'form-back':syncForm();if(S.add){S.add.lastForm=S.form;S.add.phase='input';S.form=null;S.add.resumed=false;addDlg()}break;
    case 'to-form':S.form=S.add.lastForm;S.add.phase='review';formDlg();break;
    case 'rm-ev':syncForm();S.form.v.events.splice(+t.dataset.i,1);formDlg();break;
    case 'rm-q':syncForm();S.form.v.qs.splice(+t.dataset.i,1);formDlg();break;
    case 'q-add':syncForm();S.form.v.qs.push({t:'',n:0});formDlg();break;
    case 'form-save':saveForm();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.dlg)closeDlg();else if(S.open){S.open=null;S.editQ=null;render()}return}
  if(e.key==='Enter'&&e.target.id==='shEm'){e.preventDefault();const b=document.querySelector('[data-act="sh-add"]');if(b)b.click();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  const el=e.target,c=el.dataset.ch;
  if(el.dataset.auto){DB[S.me].auto[el.dataset.auto]=el.checked;dirtyS(S.me);toast(el.checked?'자동 할 일을 켰어요':'자동 할 일을 껐어요');return}
  if(el.id==='aImg'){addFiles(el.files);return}
  if((el.dataset.f==='dueKind'||el.dataset.f==='job')&&S.ed&&el.closest('.sheet')){syncEd();renderLayer();return}
  if(el.dataset.f==='dueKind'||el.dataset.f==='job'){syncForm();formDlg();return}
  if(!c)return;const p=S.open?find(S.open):null;
  if(c==='task'){const k=el.dataset.k.split(':');let tk;if(k[0]==='g'){tk=DB[k[1]].tasks[+k[2]]}else{const q=find(k[0]);tk=q.tasks[+k[1]]}
    tk.done=el.checked;tk.doneAt=el.checked?TODAY:'';if(k[0]==='g')dirtyG(k[1]);else dirty(find(k[0]));render();if(el.checked){S.undoTask=el.dataset.k;toast('완료했어요',true,'undo-task')}}
  if(c==='stage'&&p)setStage(p,el.value);
  if(c==='qst'&&p){const q=p.qs[+el.dataset.i];q.st=el.value;q.lock=el.value==='제출본';dirty(p);render();if(q.lock)toast('제출본으로 잠갔어요')}
  if(c==='find'){S.fInd=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='fjob'){S.fJob=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='bsort'){S.bSort=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='overlay'){S.overlay=el.checked;render()}
  if(c==='recFrom'||c==='recTo'){S[c]=el.value;S.recPreset='custom';render()}
  if(c==='lstage'){S.lf.stage=el.value;if(el.value==='제출전'){S.lSort='due';S.lDir=1}render()}
  if(c==='ltype'){S.lf.type=el.value;render()}
  if(c==='lres'){S.lf.res=el.value;render()}
  if(c==='lind'){S.lf.ind=el.value?[el.value]:[];render()}
  if(c==='ljob'){S.lf.job=el.value?[el.value]:[];render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='lQ'){S.lq=el.value;const r=listRows();$('#listBody').innerHTML=r.h;$('#listCnt').textContent=r.n+'건'}
  if(el.id==='bQ'){S.bQ=el.value;$('#boardBody').innerHTML=boardBody()}
  if(el.dataset&&el.dataset.qf==='a'&&S.ed&&el.closest('.sheet')){const q=S.ed.v.qs[+el.dataset.q];const c=document.querySelector('[data-cnt="'+el.dataset.q+'"]');const len=el.value.replace(/\n/g,'').length;if(c&&q){c.textContent=len.toLocaleString()+' / '+(q.n?Number(q.n).toLocaleString():'-')+'자';c.classList.toggle('over',!!q.n&&len>q.n)}}
  if(el.id==='ansTa'){const p=find(S.open),q=p&&p.qs[S.editQ.qi];const len=el.value.replace(/\n/g,'').length;const c=$('#ansCnt');if(c&&q){c.textContent=`${len.toLocaleString()} / ${q.n?q.n.toLocaleString():'-'}자`;c.classList.toggle('over',!!q.n&&len>q.n)}}
  if(el.dataset&&el.dataset.f){const f=el.closest('.field');if(f&&String(el.value).trim())f.classList.remove('missing');
    if(el.dataset.f==='co'&&S.form&&S.form.mode!=='edit'){const n=$('#dupNote');if(n)n.innerHTML=dupH(el.value,S.form.id)}}
});
document.addEventListener('mouseover',e=>{if(narrow()||!e.target.closest)return;const m=e.target.closest('mark[data-cs]');
  if(m&&!S.pin){clearTimeout(popT);popT=setTimeout(()=>showPop(m,false),120)}else if(e.target.closest('#cpop'))clearTimeout(popT)});
document.addEventListener('mouseout',e=>{if(S.pin||!e.target.closest)return;if(!e.target.closest('mark[data-cs],#cpop'))return;const to=e.relatedTarget;
  if(to&&to.closest&&to.closest('mark[data-cs],#cpop'))return;clearTimeout(popT);popT=setTimeout(()=>{if(!S.pin)hidePop()},250)});
document.addEventListener('scroll',()=>{const el=document.getElementById('cpop');if(!el||el.hidden||narrow())return;if(S.pin){const m=markFor(S.pin);if(m)showPop(m,true)}else hidePop()},true);
document.addEventListener('selectionchange',()=>{
  const bar=$('#selbar');if(!bar)return;
  const sel=window.getSelection&&window.getSelection();const txt=sel?String(sel).trim():'';
  const node=sel&&sel.anchorNode;const el=node&&(node.nodeType===1?node:node.parentElement);const box=el&&el.closest&&el.closest('.ans');
  let qt=txt;if(qt&&box){const pp=find(box.dataset.pid),qq=pp&&pp.qs[+box.dataset.qi];if(qq&&!qq.a.includes(qt)){const t2=qt.replace(/\n\s*\n/g,'\n');if(qq.a.includes(t2))qt=t2}}
  if(txt&&box&&!box.classList.contains('empty-a')&&txt.length<=300){S.sel={qi:+box.dataset.qi,quote:qt};$('#selTxt').textContent=`“${txt}”`;bar.hidden=false}
  else if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.selbar')))bar.hidden=true;
});
document.addEventListener('paste',e=>{if(!S.add||S.add.phase!=='input'||S.add.tab!=='cap')return;const cd=e.clipboardData||{};
  const fs=[...(cd.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  const inBox=e.target&&e.target.closest&&e.target.closest('.paste-box');
  if(fs.length){e.preventDefault();addFiles(fs);return}
  const txt=cd.getData?cd.getData('text/plain'):'';
  if(e.target&&e.target.id==='aImgUrl')return;
  if(isUrl(txt)&&(inBox||!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)))){e.preventDefault();addImgUrl(txt);return}
  if(inBox){e.preventDefault();toast('복사한 이미지가 없어요')}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card[draggable]');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&!ro()){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();col.classList.remove('over');const p=find(e.dataTransfer.getData('text/plain'));if(p&&canEdit(owner(p))&&!ro())setStage(p,col.dataset.col)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me){const t=iso(new Date());if(t!==TODAY){TODAY=t;T0=new Date(TODAY+'T00:00:00')}refresh(true)}});
setInterval(()=>{if(document.visibilityState==='visible'&&S.me)refresh(true)},90000);
window.addEventListener('beforeunload',e=>{if(queue.size||saving){e.preventDefault();e.returnValue=''}});

/* ================= 시작 ================= */
const cached=LS.get('cache',null);
if(cfg.sess&&cached&&cached.meta&&cached.email===cfg.email){try{setData(cached.data,cached.meta);raw=cached.data}catch(e){}}
if(cfg.sess&&loaded&&META.me){enterMine();refresh(true)}
else if(cfg.sess){S.busy=true;render();api('loadAll').then(j=>{applyLoad(j);S.busy=false;enterMine()}).catch(e=>{S.busy=false;if(e.code!=='auth'){S.loginErr=errMsg(e);render()}})}
else render();
})();
