<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구직 플래너 (로그인 시험판)</title>
<meta name="theme-color" content="#1D6A5A">
<script>try{var t=JSON.parse(localStorage.getItem('jp_theme'));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="구직 플래너">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단바 + (PC) 왼쪽 메뉴·본문 / (폰) 본문·하단 탭바. 앱 폭 기준 컨테이너 쿼리로 전환 */
:root{
  --bg:#F4F4F5; --surface:#FFFFFF; --surface-2:#EDEDEF; --line:#DEDEE2;
  --fg:#18181B; --muted:#6B6B73; --accent:#0E8C6D; --accent-fg:#FFFFFF; --accent-soft:#DDF3EC;
  --urgent:#C4321F; --urgent-soft:#FDE6E2; --warn:#A35F00; --warn-soft:#FFF1D2;
  --ok:#2A7A4B; --ok-soft:#DDF1E4; --ro:#EFEFF2; --scrim:rgba(0,0,0,.38); --shadow:rgba(0,0,0,.10);
  --frame:#2A2A2E;
  --s1:#8E8E96; --s2:#C08A2A; --s3:#3A74B5; --s4:#0E8C6D; --s5:#5C5C63;
  --due:#D9480F; --due-soft:#FFE8D9;
  --st-start:#7A7A85; --st-start-soft:#ECECEF; --st-write:#A26A00; --st-write-soft:#FDF0CF; --st-sub:#2463B0; --st-sub-soft:#DFEBFA; --st-test:#7444C8; --st-test-soft:#ECE3FB; --st-int:#17804F; --st-int-soft:#DAF2E5; --st-end:#8A8A92; --st-end-soft:#F0F0F2;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1B1B1E; --surface-2:#26262A; --line:#34343A;
  --fg:#EDEDEF; --muted:#9C9CA4; --accent:#2FD3A2; --accent-fg:#06140F; --accent-soft:#1C2F29;
  --urgent:#FF7B66; --urgent-soft:#3B1F1A; --warn:#F0B54E; --warn-soft:#3A2E13;
  --ok:#6FCB8E; --ok-soft:#1C3325; --ro:#18181B; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
  --frame:#3A3A40; --s1:#9696A0; --s2:#E0A94A; --s3:#6EA4E0; --s4:#2FD3A2; --s5:#8E8E96;
  --due:#FF7A45; --due-soft:#3A2214;
  --st-start:#B4B4BD; --st-start-soft:#2B2B30; --st-write:#F2C14E; --st-write-soft:#3A3115; --st-sub:#79AEF2; --st-sub-soft:#1B2B40; --st-test:#BC9CF5; --st-test-soft:#2E2442; --st-int:#5BD98E; --st-int-soft:#173423; --st-end:#77777F; --st-end-soft:#1F1F23;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1B1B1E; --surface-2:#26262A; --line:#34343A;
  --fg:#EDEDEF; --muted:#9C9CA4; --accent:#2FD3A2; --accent-fg:#06140F; --accent-soft:#1C2F29;
  --urgent:#FF7B66; --urgent-soft:#3B1F1A; --warn:#F0B54E; --warn-soft:#3A2E13;
  --ok:#6FCB8E; --ok-soft:#1C3325; --ro:#18181B; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.45);
  --frame:#3A3A40; --s1:#9696A0; --s2:#E0A94A; --s3:#6EA4E0; --s4:#2FD3A2; --s5:#8E8E96;
  --due:#FF7A45; --due-soft:#3A2214;
  --st-start:#B4B4BD; --st-start-soft:#2B2B30; --st-write:#F2C14E; --st-write-soft:#3A3115; --st-sub:#79AEF2; --st-sub-soft:#1B2B40; --st-test:#BC9CF5; --st-test-soft:#2E2442; --st-int:#5BD98E; --st-int-soft:#173423; --st-end:#77777F; --st-end-soft:#1F1F23;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.small{font-size:12.5px}

.preview{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;max-width:1240px;margin:0 auto 12px}
.preview p{margin:0;color:var(--muted);font-size:13px}
.preview b{color:var(--fg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow);font-weight:600}
@media (max-width:700px){.preview .seg{display:none}}

.frame{max-width:1240px;margin:0 auto}
.frame.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 90px));border:10px solid var(--frame);border-radius:38px;overflow:hidden;transform:translateZ(0);background:var(--bg)}
.frame.phone .app{height:100%;overflow-y:auto}
.frame.pc .app{border:1px solid var(--line);border-radius:14px;min-height:calc(100vh - 80px);background:var(--bg)}
.app{container:app/inline-size;position:relative}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.frame.phone .top{border-radius:0}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.top .seg{margin-left:auto}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;color:var(--muted);padding:0 8px}
.icon-btn svg{width:18px;height:18px}

.shell{display:grid;grid-template-columns:196px minmax(0,1fr)}
.side{padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);position:sticky;top:55px;align-self:start}
.side .add{margin-bottom:12px}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{padding:20px 24px 40px;min-width:0}
.tabbar,.fab,.coltabs{display:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.block{width:100%}
.btn.danger{color:var(--urgent);border-color:var(--urgent)}
.btn.sm{padding:4px 10px;font-size:13px}
.link-btn{border:0;background:none;color:var(--accent);padding:0;font-weight:500;text-decoration:none}

.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ro-banner{display:flex;align-items:center;gap:8px;background:var(--ro);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px;color:var(--muted);font-size:13px}
.app.ro .main{background:var(--ro)}
.app.ro .side .add,.app.ro .fab{visibility:hidden}

.home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.count{font-family:var(--f-num);font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 7px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;text-align:left;width:100%}
.row.click{cursor:pointer}
.row.click:hover{border-color:var(--muted)}
.row.overdue{border-color:var(--urgent);align-items:flex-start}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.partner{background:transparent;border-style:dashed}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chev{color:var(--muted);flex:none}
.dd{font-family:var(--f-num);font-weight:600;min-width:56px;text-align:center;padding:3px 8px;border-radius:6px;background:var(--surface-2);font-size:13px;flex:none}
.dd.urgent{background:var(--urgent-soft);color:var(--urgent)}
.dd.warn{background:var(--warn-soft);color:var(--warn)}
.dd.unk{font-family:var(--f-body);font-size:12px}
.dd.sm{min-width:0;font-size:12px;padding:1px 6px}
.kind{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:15px}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none}
.done .t{text-decoration:line-through;color:var(--muted)}
.late{color:var(--urgent);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px}
.sub-h{color:var(--muted);font-size:12.5px;margin-top:4px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.search{flex:1;max-width:260px}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;min-width:940px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;padding:2px 4px 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.card .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.card .mini{align-self:flex-start;display:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--urgent-soft);color:var(--urgent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.grp{border:0;background:transparent;display:flex;justify-content:space-between;width:100%;padding:6px 6px;border-radius:6px;color:var(--fg);font-weight:500}
.grp:hover{background:var(--surface)}

.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cal-wrap.full{grid-template-columns:minmax(0,1fr)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-h strong{font-size:15px;min-width:110px;text-align:center}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cell{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;background:transparent;border-top:0;border-left:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.cell.other .n{opacity:.35}
.cell.today .n{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 5px;align-self:flex-start}
.cell.sel{background:var(--accent-soft)}
.ev{font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{opacity:.5}
.cell.week{min-height:170px}
.cell.week .ev{white-space:normal}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);padding:8px 12px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.daylist{display:flex;flex-direction:column;gap:14px;padding:14px}
.daylist h4{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.daylist h4.today{color:var(--accent)}

.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.prog button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.prog button span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.prog button b{font-family:var(--f-num);font-size:22px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .num{text-align:right;color:var(--muted)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:51;overflow-y:auto;box-shadow:-8px 0 24px var(--shadow);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border-radius:14px;z-index:53;box-shadow:0 12px 40px var(--shadow)}
.dlg-h,.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h3,.sheet-h h3{font-size:16px;flex:1;min-width:0}
.dlg-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-b{padding:4px 18px 24px}
.blk{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.blk:last-child{border-bottom:0}
.blk-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.sum .co{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sum .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.links{display:flex;gap:16px;flex-wrap:wrap}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.step{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.step.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step.now{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.step.fail{background:var(--urgent-soft);border-color:transparent;color:var(--urgent);font-weight:600}
.arrow{color:var(--muted);font-size:12px}
.q{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.q p{margin:0;overflow-wrap:anywhere}
.q .qm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mini-sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12.5px}
.stage-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-weight:600}
.inline{display:flex;gap:6px;flex-wrap:wrap}
.inline input,.inline select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0}
.inline input[type=text]{flex:1}
.hist{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.hist .num{margin-right:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lb{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field.missing input,.field.missing select,.field.missing textarea{background:var(--warn-soft);border-color:var(--warn)}
.field.focus input{outline:2px solid var(--urgent);outline-offset:1px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note.bad{background:var(--urgent-soft);color:var(--urgent)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
details.orig{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.orig summary{cursor:pointer;font-weight:600;font-size:13px}
details.orig .body{margin-top:8px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
details.orig pre{white-space:pre-wrap;font:inherit;max-height:200px;overflow:auto;margin:0}
.qe{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px}
.qe textarea{min-height:64px}
.qe .qr{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.qe .qr input{width:96px}
.spin{width:28px;height:28px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.li{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);padding:2px 6px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list button,.menu-list label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;text-align:left;font-weight:500;cursor:pointer}
.menu-list .cur{border-color:var(--accent);color:var(--accent);font-weight:600}
.menu-list input{accent-color:var(--accent)}
.radio-row{display:flex;flex-wrap:wrap;gap:6px}
.radio-row label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.radio-row input{accent-color:var(--accent)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.ok-t{color:var(--ok);font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;white-space:nowrap;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}

@container app (max-width:760px){
  .top{padding:10px 14px}
  .brand span{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:16px 14px 100px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .fab{display:grid;place-items:center;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);z-index:31;box-shadow:0 6px 16px var(--shadow)}
  .fab svg{width:24px;height:24px}
  .home{grid-template-columns:minmax(0,1fr)}
  .coltabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .coltabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;white-space:nowrap;font-size:13px;color:var(--muted)}
  .coltabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
  .board-wrap{overflow:visible}
  .board{grid-template-columns:minmax(0,1fr);min-width:0}
  .col{min-height:0;background:transparent;padding:0}
  .col:not(.active){display:none}
  .col-h{display:none}
  .card .mini{display:inline-block}
  .search{max-width:none;flex-basis:100%}
  .cal-wrap{grid-template-columns:minmax(0,1fr)}
  .cell{min-height:56px;padding:3px}
  .ev .tx{display:none}
  .cell.week .ev .tx{display:inline}
  .prog{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:minmax(0,1fr)}
  .sheet{width:100%}
  .f2{grid-template-columns:minmax(0,1fr)}
}

/* ---- v1.2 추가 ---- */
:root{--hl:#FFE38A;--hl-on:#F5C842}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl:#5C4A12;--hl-on:#8A6D16}}
:root[data-theme="dark"]{--hl:#5C4A12;--hl-on:#8A6D16}
.prof{border:0;background:transparent;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;white-space:nowrap}
.prof:hover{background:var(--surface-2)}
.prof i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.peek{margin-left:auto;white-space:nowrap}
.peek-on{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.start{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.start-in{width:min(460px,100%);display:flex;flex-direction:column;gap:18px;text-align:center}
.start h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 3px var(--shadow)}
.pcard:hover{border-color:var(--accent)}
.pcard .av{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700}
.pcard b{font-size:17px}
.pw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pw input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;width:150px;text-align:center;letter-spacing:.3em}
.ev{display:block}
.ans{white-space:pre-wrap;line-height:1.75;padding:10px 12px;background:var(--surface-2);border-radius:8px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.ans.empty-a{color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px;cursor:pointer;padding:0 1px}
mark.on{background:var(--hl-on)}
.qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.qbar .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.cnt{font-family:var(--f-num)}
.cnt.over{color:var(--urgent);font-weight:600}
.ans-ta{width:100%;min-height:220px;border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--surface);line-height:1.7;resize:vertical}
.cmts{display:flex;flex-direction:column;gap:6px}
.cmt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.cmt.flash{outline:2px solid var(--accent);outline-offset:1px}
.cmt.res{opacity:.6}
.cmt .who{font-weight:600}
.cmt .q-quote{color:var(--muted);font-size:12px;border-left:2px solid var(--hl-on);padding-left:6px;overflow-wrap:anywhere}
.cmt .acts2{display:flex;gap:10px}
.cmt .rep{margin-left:12px;padding-left:8px;border-left:1px solid var(--line);color:var(--fg)}
.lost{color:var(--warn);font-size:12px}
.selbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--fg);color:var(--bg);padding:10px 12px;display:flex;gap:10px;align-items:center;border-radius:12px;margin-top:8px;box-shadow:0 6px 18px var(--shadow)}
.selbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.selbar button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 12px;font-weight:600;white-space:nowrap}
.newc .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jobs{display:flex;flex-wrap:wrap;gap:6px}
.jobs span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px}
@container app (max-width:760px){
  .ev .tx{display:inline}
  .ev{font-size:10px;line-height:1.3;letter-spacing:-.02em}
  .cell{padding:2px}
  .prof span.nm{max-width:72px;overflow:hidden;text-overflow:ellipsis}
}
/* 로그인 시험판: 공유 버튼 · 로그인 화면 · 공유 창 */
[hidden]{display:none!important}
.top .peek{margin-left:0}
.top .peek-on{margin-left:auto}
.gbtn{display:flex;justify-content:center;min-height:44px;color-scheme:light}
.test-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.sh-add{display:flex;gap:8px}
.sh-add input{flex:1;min-width:0}
.sh-list{display:flex;flex-direction:column;gap:2px}
.sh-row{display:flex;align-items:center;gap:10px;padding:8px 2px;position:relative}
.sh-row .av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.sh-row .grow{min-width:0}
.sh-row .grow b,.sh-row .grow .small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-role{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px;white-space:nowrap}
.sh-role:hover{background:var(--surface-2);color:var(--fg)}
.sh-menu{position:absolute;right:0;top:100%;z-index:5;width:min(300px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px var(--shadow);padding:6px;display:flex;flex-direction:column}
.sh-menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column;gap:2px}
.sh-menu button:hover{background:var(--surface-2)}
.sh-menu button.cur b::after{content:' ✓';color:var(--accent)}
.sh-menu .rm{color:var(--urgent);border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.sh-gen{display:flex;align-items:center;gap:10px;padding:8px 2px}
.acct-row{display:flex;align-items:stretch;gap:6px}
.acct-row>button{flex:1;min-width:0}
.menu-list .ovl-tg{flex:none;white-space:nowrap;font-size:12px;font-weight:400;padding:8px 10px;color:var(--muted)}
.dlg-b a.btn{align-self:flex-start;text-decoration:none}
/* 달력 색 = 일정 종류 */
/* 서류 마감(가장 많음) = 차분한 파랑, 제출 일정 = 자주색 (공고 단계의 '제출' 색과는 따로) */
:root{--ev-sub:#A3307A;--ev-sub-soft:#F9E2F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ev-sub:#EE8FC6;--ev-sub-soft:#3A1E30}}
:root[data-theme="dark"]{--ev-sub:#EE8FC6;--ev-sub-soft:#3A1E30}
.st-due{--col:var(--st-sub);--soft:var(--st-sub-soft)}
.st-evsub{--col:var(--ev-sub);--soft:var(--ev-sub-soft)}
.st-ann{--col:var(--st-write);--soft:var(--st-write-soft)}
.bad-url{font-size:12px;color:var(--urgent)}
/* 달력 바: 자리가 모자라면 바는 그대로 두고 글씨 끝만 바 색으로 흐리게 */
.cal .ev.fade{-webkit-mask-image:none;mask-image:none;position:relative}
.cal .ev.fade::after{content:"";position:absolute;top:0;right:0;bottom:0;width:28px;border-radius:0 4px 4px 0;pointer-events:none;background:linear-gradient(to right,transparent,var(--soft,var(--surface)))}

/* ---- 실제 앱용 덮어쓰기 ---- */
html,body{margin:0}
body{padding:0}
.app{min-height:100vh;min-height:100dvh;background:var(--bg)}
.top{border-radius:0;padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.app.starting .top,.app.starting .shell,.app.starting .tabbar,.app.starting .fab{visibility:hidden}
.pcard[disabled]{opacity:.6;cursor:wait}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@container app (max-width:760px){
  .top{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .sync{display:none}
}
/* 달력: 오늘 칸은 테두리만, 서류 마감은 눈에 띄게 */
.cell.sel{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.kind.k-due{background:var(--due-soft);color:var(--due)}
.dd.urgent{background:var(--due-soft);color:var(--due)}
/* 달력: 화면 높이에 맞춰 꽉 차게 (PC) */
.cal.fill{display:flex;flex-direction:column;height:calc(100vh - 175px);height:calc(100dvh - 175px);min-height:600px}
.cal.fill .grid7{flex:1;min-height:0}
.cal.fill .cell{min-height:0;overflow:hidden;position:relative}
.cal.fill .cell.week{min-height:0}
.cal .ev{font-size:13px;line-height:1.5}
.cal .cell .n{font-size:13px}
@container app (max-width:760px){
  .cal.fill{height:auto;min-height:0}
  .cal.fill .grid7{grid-template-rows:auto!important}
  .cal.fill .cell{min-height:64px}
  .cal.fill .cell.week{min-height:150px}
  .cal .ev{font-size:10px;line-height:1.3}
  .cal .cell .n{font-size:12px}
}
/* 휴대폰 주 보기: 요일별 세로 목록 */
.weeklist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}
.wrow:last-child{border-bottom:0}
.wrow.today{background:var(--accent-soft)}
.wday{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.wday b{font-size:15px;color:var(--fg)}
.wrow .list{gap:6px}
@container app (max-width:760px){
  .cal .ev{font-size:11px;letter-spacing:-.03em}
  .cal .ev .tx{display:inline}
}
.wrow.today{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
@container app (max-width:760px){
  .cal .grid7 .ev .ico{display:none}
  .cal .grid7 .ev{padding:0 2px;font-size:11px}
}
/* 보드 8칸 (PC: 가로로 나란히, 좁으면 가로 스크롤) */
.board{grid-template-columns:repeat(8,minmax(160px,1fr));min-width:1320px}
.prog{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
/* 휴대폰 보드: 단계를 위에서 아래로 */
@container app (max-width:760px){
  .coltabs{display:none}
  .board{grid-template-columns:minmax(0,1fr);min-width:0;gap:18px}
  .col,.col:not(.active){display:flex;background:transparent;padding:0;min-height:0}
  .col-h{display:flex;font-size:15px;padding:0 2px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
  .col.empty-col{gap:0}
  .col.empty-col .col-h{color:var(--muted);font-weight:500;font-size:13px;border-bottom:0;margin:0}
  .col.empty-col .empty{display:none}
}
@container app (max-width:760px){.pc-only{display:none}}
/* 공고 상세: 노션처럼 가운데 큰 창 */
.sheet{top:4vh;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:min(960px,94vw);height:92vh;height:92dvh;border-radius:16px;box-shadow:0 24px 64px var(--shadow)}
.sheet-h{border-radius:16px 16px 0 0}
.sheet-b{padding:8px 32px 40px}
.sheet .sum .co{font-size:24px}
.sheet .q p{font-size:15px}
.sheet .ans{font-size:15px;padding:12px 16px}
@container app (max-width:760px){
  .sheet{top:0;left:0;transform:none;width:100%;height:100%;border-radius:0}
  .sheet-h{border-radius:0}
  .sheet-b{padding:4px 16px 24px}
}
/* 형광펜 댓글 말풍선 */
mark[data-cs]{cursor:pointer}
.cbar{font-size:12.5px;color:var(--muted)}
.cpop{position:fixed;z-index:58;max-height:min(60vh,520px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cpop[hidden]{display:none}
.cpop .cmt{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px 8px;background:transparent}
.cpop .cmt:last-child{border-bottom:0}
.cpop .q-quote{display:none}
.cpop-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.cpop.sheetpop{left:0;right:0;bottom:0;top:auto;width:auto;border-radius:16px 16px 0 0;max-height:60vh;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
/* 달력: 단계 색 */
.cal .ev[class*="st-"]{color:var(--col);background:var(--soft);border-radius:4px;padding:0 4px;margin-bottom:1px}
.st-start{--col:var(--st-start);--soft:var(--st-start-soft)}
.st-write{--col:var(--st-write);--soft:var(--st-write-soft)}
.st-sub{--col:var(--st-sub);--soft:var(--st-sub-soft)}
.st-test{--col:var(--st-test);--soft:var(--st-test-soft)}
.st-int{--col:var(--st-int);--soft:var(--st-int-soft)}
.st-end{--col:var(--st-end);--soft:var(--st-end-soft)}
.cal .ev.k-due{font-weight:700}
.cal .ev.st-end{opacity:.75}
.cal .ev.p{opacity:.5}
.legend .lg{display:inline-flex;align-items:center;gap:5px;color:var(--col);font-weight:600}
.legend .lg i{width:10px;height:10px;border-radius:3px;background:var(--col);display:inline-block}
.wd.sun{color:var(--urgent)}
.wd.sat{color:var(--st-sub)}
.cal-side{display:flex;flex-direction:column;gap:18px;min-width:0}

/* 달력 칸 글자 */
.cal .ev .tx b{font-weight:700}
.cal .ev .ty{opacity:.8;font-weight:500}
/* 잘린 글자: 끝을 흐리게 (말줄임표 대신) */
.fade{text-overflow:clip!important;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
/* 날짜 없는 공고: 작게 */
.minis{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mini-row{padding:7px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.mini-row:last-child{border-bottom:0}
.mini-row:hover{background:var(--surface-2)}
/* 왼쪽 메뉴 접기 */
.side-tg{flex:none}
.app.side-off .side{display:none}
.app.side-off .shell{grid-template-columns:minmax(0,1fr)}
.app.side-off .fab{display:grid;place-items:center;position:fixed;right:28px;bottom:28px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);z-index:31;box-shadow:0 6px 16px var(--shadow)}
.app.side-off .fab svg{width:24px;height:24px}
@container app (max-width:760px){.side-tg{display:none}}

/* 오른쪽 칸: 달력 높이에 맞추고, 날짜 없는 공고는 맨 아래에 고정 */
.cal-side{height:calc(100vh - 175px);height:calc(100dvh - 175px);min-height:600px;overflow-y:auto}
.cal-side .sec.nod{margin-top:auto;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
@container app (max-width:760px){.cal-side{height:auto;min-height:0;overflow:visible}.cal-side .sec.nod{position:static;margin-top:0}}

/* ===== 정리: 차분하게 ===== */

.app.side-off .top-add{display:inline-block}
.app.side-off .fab{display:none}
.app.ro .top-add{display:none}
@container app (max-width:760px){.app.side-off .top-add{display:none}.app.side-off .fab,.fab{display:grid}}

/* 기록: 직무·업권 눌러서 고르기 */

.bar.pick:hover{background:var(--surface-2)}
.bar.dim{opacity:.35}

.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.fchip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}

/* 5. 보드가 옆으로 더 있으면 오른쪽 끝을 흐리게 */
.board-wrap.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
/* 6. 계정 메뉴의 관리자 콘솔 버튼도 다른 버튼과 같은 글자색 */
.dlg-b a.btn{color:var(--fg)}
/* 마감 임박 D-day: 달력 바 색과 겹치지 않게 빨강 계열. D-1 이하는 꽉 찬 빨강, D-2~3은 연한 빨강 */
.dd.urgent{background:var(--urgent);color:var(--surface)}

/* 일정 목록의 서류 마감 아이콘도 달력과 같은 파랑 */
.kind.k-due{background:var(--st-sub-soft);color:var(--st-sub)}
/* 자소서 문항: [수정] 모드 · + 문항 추가 (2026-11-22) */
.q-hbtn{margin-left:auto;display:inline-flex;gap:6px}
.q-add-btn{width:100%;min-height:44px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}

<script>
(function(){
/* ================= 기본 ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let TODAY=iso(new Date()),T0=new Date(TODAY+'T00:00:00');
const WD=['일','월','화','수','목','금','토'];
const dt=s=>new Date(String(s).slice(0,10)+'T00:00:00');
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((dt(s)-T0)/864e5);
const md=s=>{if(!s)return '';const d=dt(s);if(isNaN(d))return esc(s);/* 날짜가 아니면 글자로만 (코드가 끼어들지 않게) */return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const ddL=n=>n===0?'D-day':n>0?'D-'+n:'D+'+(-n);
const ddC=n=>n<=1?'urgent':n<=3?'warn':'';
const okUrl=u=>/^https?:\/\/[^\s]+$/i.test(String(u||'').trim()); /* javascript: 같은 주소는 링크로 걸지 않음 */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 시트에서 온 id 에 따옴표·꺾쇠 같은 글자가 있으면 바꿔 둠 (화면 속성에 넣을 때 코드가 끼어들지 않게) */
const sid=x=>String(x??'').replace(/[\s"'<>&`=\\]/g,'_').slice(0,100);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KIND={due:['📝','서류 마감'],sub:['📤','제출'],apt:['🧠','인적성·AI역량'],int:['🎤','면접'],ann:['📢','결과 발표'],etc:['•','기타']};
const COLS=[['관심','시작 전','--st-start'],['작성중','작성 중','--st-write'],['제출','제출','--st-sub'],['인적성','인적성·필기','--st-test'],['면접1','1차 면접','--st-int'],['면접2','2차 면접','--st-int'],['면접3','3차 면접','--st-int'],['종료','종료','--st-end']];
const PROC=['인적성','면접1','면접2','면접3'];
const isProc=p=>PROC.includes(p.stage);
function stageOfStep(s){s=String(s||'');if(/1차/.test(s))return '면접1';if(/2차/.test(s))return '면접2';if(/3차|최종|임원/.test(s))return '면접3';if(/인적성|필기|AI|역량|SKCT|코딩|TEST|테스트|과제|검사/i.test(s))return '인적성';if(/면접|인터뷰/.test(s))return '면접1';return '인적성'}
function stepIdxFor(p,st){const i=p.steps.findIndex((s,j)=>j>0&&stageOfStep(s)===st);return i}
const COLNAME=Object.fromEntries(COLS.map(c=>[c[0],c[1]]));
const RESULTS=['최종합격','불합격','포기/무응답','인재풀'];
const DUEKIND=[['확정','확정 (일시 있음)'],['채용시','채용 시 마감'],['미확인','미확인']];
const TYPES=['체험형','전환형','정규직','계약직'];
const HOT_DAYS=3; /* 마감 임박 기준 (홈·달력 공통) */
/* 업권 선택지: 사람마다 따로 (설정 'inds'). 지금 공고에 쓰인 값이 목록에 없으면 같이 보여 줌 */
const indsOf=(w,cur)=>{const l=[...((DB[w]&&DB[w].inds)||INDS)];(Array.isArray(cur)?cur:[cur]).forEach(c=>{if(c&&!l.includes(c))l.push(c)});return l};
const INDS=['은행','증권','자산운용','저축은행','캐피탈/카드','보험','공기업','일반기업','기타'];

/* 글자 수 세기 (2026-11-22 기준): 공백·줄바꿈 모두 포함
   - 글자(자): 줄바꿈도 1자
   - 바이트: 한글 등 2바이트, 영문·숫자·공백·줄바꿈 1바이트 (네이버 글자수 세기와 같음) */
const qLen=(s,u)=>{s=String(s||'').replace(/\r\n?/g,'\n');if(u!=='byte')return [...s].length;let n=0;for(const ch of s)n+=ch.charCodeAt(0)<128?1:2;return n};

const qUnitSel=(attrs,u)=>`<select class="mini-sel" ${attrs} aria-label="글자 수 단위"><option value="" ${u!=='byte'?'selected':''}>자</option><option value="byte" ${u==='byte'?'selected':''}>바이트</option></select>`;
/* 문항 정리 기준: 본문은 원문 그대로. 맨 앞 번호(1. · 문항 1 · Q1 · [문항1] · ①)와 글자 수 표시((500자 이상, 1000자 이하) 등)만 떼어 냄.
   글자 수는 최대만 남김(최소는 버림). 새로 넣는 문항에만 적용 (이미 저장된 문항은 그대로) */
const Q_NUM=/^\s*(?:\[\s*(?:문항|질문)?\s*\d{1,2}\s*\]|(?:문항|질문|Q)\s*\.?\s*\d{1,2}(?!\d)\s*[.):\]]?|\d{1,2}\s*[.)](?!\d)|\(\d{1,2}\)|[①-⑳])\s*/i;
const Q_LIM='\\d[\\d,]*\\s*(?:자|bytes?|바이트)';
function cleanQ(q){
  let t=String(q.t||'').replace(/\r\n?/g,'\n').trim(),n=Math.max(0,parseInt(q.n,10)||0),u=q.u==='byte'?'byte':'';const got=[];
  for(let k=0;k<3;k++){const t2=t.replace(Q_NUM,'');if(t2===t)break;t=t2}
  const take=m=>{got.push(m);return ' '};
  t=t.replace(new RegExp('[\\(\\[（][^()\\[\\]（）]*?'+Q_LIM+'[^()\\[\\]（）]*[\\)\\]）]','gi'),take);
  t=t.replace(new RegExp('^\\s*(?:최대\\s*)?'+Q_LIM+'\\s*(?:이상|이내|이하|까지)?\\s*[:：\\-–]?\\s*','i'),take);
  for(let k=0;k<2;k++)t=t.replace(new RegExp('\\s*[-–·:]?\\s*(?:공백\\s*포함\\s*)?(?:최대\\s*)?'+Q_LIM+'\\s*(?:이상|이내|이하|까지)?\\s*$','i'),take);
  t=t.replace(/[ \t]{2,}/g,' ').replace(/^\s+|\s+$/g,'');
  let mx=0,isB=false;got.forEach(g=>{const re=/(\d[\d,]*)\s*(자|bytes?|바이트)/gi;let m;while((m=re.exec(g))){const v=+m[1].replace(/,/g,'');if(v>mx){mx=v;isB=!/자/.test(m[2])}}});
  if(!n&&mx){n=mx;if(isB)u='byte'}else if(mx&&isB&&!u)u='byte';
  return Object.assign({},q,{t,n,u});
}
/* 여러 문항을 한 번에 붙여넣으면 번호로 시작하는 줄마다 나눔 (나눈 결과는 보여 주고 확인받음) */
/* 번호 모양과 숫자: '1.' → {k:'d.',n:1}, '문항 2' → {k:'w문항',n:2}, '[문항3]' → {k:'b',n:3}, '(4)' → {k:'p',n:4}, '⑤' → {k:'c',n:5} */
function qNo(l){let m;
  if((m=l.match(/^\s*\[\s*(?:문항|질문)?\s*(\d{1,2})\s*\]/)))return {k:'b',n:+m[1]};
  if((m=l.match(/^\s*(문항|질문|Q)\s*\.?\s*(\d{1,2})(?!\d)/i)))return {k:'w'+m[1].toUpperCase(),n:+m[2]};
  if((m=l.match(/^\s*(\d{1,2})\s*([.)])(?!\d)/)))return {k:'d'+m[2],n:+m[1]};
  if((m=l.match(/^\s*\((\d{1,2})\)/)))return {k:'p',n:+m[1]};
  if((m=l.match(/^\s*([①-⑳])/)))return {k:'c',n:m[1].charCodeAt(0)-0x245F};
  return null}
/* 여러 문항 나누기 (API 없이 규칙으로). 막 나누지 않게:
   ① 첫 줄이 번호로 시작해야 하고 ② 첫 줄과 같은 모양의 번호가 1, 2, 3… 차례로 나올 때만 새 문항으로 봄
   → 문항 안의 "1) 협업 2) 실패" 같은 보기 번호는 모양이 달라서 안 나뉨. 결과는 항상 보여 주고 확인받음 */
function splitQs(txt){
  const lines=String(txt||'').replace(/\r\n?/g,'\n').split('\n'),first=lines.find(l=>l.trim());
  const f0=first?qNo(first):null,parts=[];let cur=[],want=f0?f0.n:0;
  if(f0)lines.forEach(l=>{const m=qNo(l);
    if(m&&m.k===f0.k&&m.n===want){if(cur.join('').trim())parts.push(cur.join('\n'));cur=[l];want++}else cur.push(l)});
  if(cur.join('').trim())parts.push(cur.join('\n'));
  const list=(f0&&parts.length>1?parts:[String(txt||'')]).map(t=>cleanQ({t})).filter(q=>q.t);
  return list;
}

function ensureIds(p){p.qs.forEach(q=>{if(!q.id)q.id=uid()});p.events.forEach(e=>{if(!e.id)e.id=uid()});p.tasks.forEach(t=>{if(!t.id)t.id=uid()});p.hist.forEach(h=>{if(!h.id)h.id=uid()})}
const childRows=p=>({
  qs:p.qs.map((q,i)=>({id:q.id,pid:p.id,i,t:q.t,n:q.n,a:q.a,st:q.st,lock:Y(q.lock),ver:q.ver||'',u:q.u||''})),
  events:p.events.map(e=>({id:e.id,pid:p.id,d:e.d,k:e.k,t:e.t})),
  tasks:p.tasks.map(t=>({id:t.id,pid:p.id,t:t.t,due:t.due,done:Y(t.done),doneAt:t.doneAt||'',auto:Y(t.auto)})),

    c[t].forEach(r=>{now.add(r.id);if(S0[t][r.id]!==JSON.stringify(r))up.push(r)});
    if(up.length){ops.push({op:'upsert',table:t,rows:up});changed=true}
    Object.keys(S0[t]).forEach(id=>{if(!now.has(id)){ops.push({op:'remove',table:t,key:'id',value:id});changed=true}})});

async function api(action,body){
  if(!cfg.server)throw {code:'no_server'};
  let res;
  try{res=await fetch(DEFAULT_SERVER,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({sess:cfg.sess,action},body||{}))})}
  catch(e){throw {code:'network'}}
  let j;try{j=await res.json()}catch(e){throw {code:'bad_response'}}
  if(!j.ok&&j.error==='auth'&&action!=='login'){logout(true);throw {code:'auth'}}
  if(!j.ok)throw {code:j.error||'error',detail:j.detail,usage:j.usage};
  return j;
}

async function flush(){

  items.forEach(([k,it])=>{const r=it.opsFn();const ops=Array.isArray(r)?r:(r.ops||[]);(byW[it.w]=byW[it.w]||[]).push(...ops);if(r.done)dones.push({k,done:r.done})});

  try{let conf=[],revs={};
    for(const w of Object.keys(byW))if(byW[w].length){const j=await api('batch',{pid:w,ops:byW[w]});conf=conf.concat(j.conflicts||[]);Object.assign(revs,j.revs||{});delete pend.byW[w];LS.set('pend',pend)}
    LS.del('pend');dones.forEach(d=>{if(!conf.includes(d.k))d.done(revs)});if(conf.length)reloadAfter=true;cacheData()}
  catch(e){if(e&&e.code==='auth'){saving=false;return}if(e&&e.code==='forbidden'){LS.del('pend');toast('이 플래너를 고칠 권한이 없어요. 새로 불러올게요');saving=false;refresh(true);return}
    saveErr=true;items.forEach(([k,it])=>{if(!queue.has(k))queue.set(k,it)});cacheData()}
  saving=false;showSync();
  if(queue.size&&!saveErr){flush();return}
  if(reloadAfter&&!queue.size){reloadAfter=false;await refresh(true);toast('다른 기기에서 바뀐 공고가 있어서 새로 불러왔어요. 방금 한 수정은 다시 해 주세요')}
}

const STK={'관심':'start','작성중':'write','제출':'sub','인적성':'test','면접1':'int','면접2':'int','면접3':'int','종료':'end'};
const STLEG=[['due','서류 마감'],['test','인적성·필기'],['int','면접'],['ann','결과 발표'],['evsub','제출'],['start','기타']];
const EVC={due:'due',apt:'test',int:'int',ann:'ann',sub:'evsub',etc:'start'}; /* 달력 색 = 일정 종류 (마감·면접 등). 끝난 공고 일정은 흐리게 */
function taskRowH(x){const n=diff(x.t.due);return `<div class="row ${x.t.done?'done':''}"><input type="checkbox" class="chk" data-ch="task" data-k="${x.key}" ${x.t.done?'checked':''} ${ro()?'disabled':''} aria-label="완료"><span class="grow"><div class="t">${esc(x.t.t)}${x.t.auto?' <span class="pill mute">자동</span>':''}</div><div class="s">${x.p?esc(shortCo(x.p.co))+' · ':''}${x.t.done?'오늘 완료':n<0?`<span class="late">${md(x.t.due)} 지남</span>`:n===0?'오늘':md(x.t.due)}</div></span>${x.p?`<button class="link-btn" data-act="open" data-id="${x.p.id}">공고 ›</button>`:''}</div>`}
function calSide(evm,mode,nar){
  const today=tasksOf(S.who).filter(x=>x.t.due&&diff(x.t.due)<=0&&!x.t.done).sort((a,b)=>a.t.due.localeCompare(b.t.due));
  const left=today.length;
  let h=`<section class="sec"><h3>오늘 할 일 <span class="count">${left}</span></h3><div class="list">${today.length?today.map(taskRowH).join(''):'<div class="empty">오늘 기한인 할 일이 없어요</div>'}</div></section>`;
  const hot=vis(S.who).filter(p=>isOpen(p)&&p.dueKind==='확정'&&p.due&&diff(p.due)>=0&&diff(p.due)<=HOT_DAYS).sort((a,b)=>a.due.localeCompare(b.due));
  if(hot.length)h+=`<section class="sec"><h3>🔥 마감 임박 공고 <span class="count">${hot.length}</span></h3><div class="list">${hot.map(p=>{const n=diff(p.due);return rowOpen(p.id,'',`<span class="dd ${ddC(n)}">${ddL(n)}</span><span class="grow"><div class="t oneline" title="${esc(full(p))}">${esc(label(p))}</div><div class="s">${md(p.due)} ${p.due.slice(11,16)} 마감</div></span><span class="chev">›</span>`)}).join('')}</div></section>`;
  if(!(mode==='week'&&nar)){
    const sel=evm[S.calSel]||[];
    if(nar&&!sel.length){/* 휴대폰: 고른 날에 일정이 없으면 앞으로 7일 */
      const up=[];for(let i=0;i<=7;i++){const k=addDays(TODAY,i);(evm[k]||[]).forEach(x=>up.push(x))}
      h+=`<section class="sec"><h3>${md(S.calSel)}엔 일정이 없어요 · 앞으로 7일 <span class="count">${up.length}</span></h3><div class="list">${up.length?up.map(x=>evRow(Object.assign({},x,{day:x.e.d}))).join(''):'<div class="empty">앞으로 7일 동안 일정이 없어요</div>'}</div></section>`;
    }else h+=`<section class="sec"><h3>${md(S.calSel)} 일정 <span class="count">${sel.length}</span></h3><div class="list">${sel.length?sel.map(evRow).join(''):'<div class="empty">이 날은 일정이 없어요</div>'}</div></section>`;
  }
  const nod=vis(S.who).filter(p=>isOpen(p)&&p.dueKind!=='확정');
  if(nod.length)h+=`<section class="sec nod"><h3>날짜 없는 공고 <span class="count">${nod.length}</span></h3><div class="minis">${nod.map(p=>`<div class="mini-row oneline" role="button" tabindex="0" data-act="open" data-id="${p.id}" title="${esc(full(p))}">${esc(label(p))}</div>`).join('')}</div></section>`;
  return `<div class="cal-side">${h}</div>`;
}
function calHTML(){
  const mode=S.calMode,evm=calEvents();
  const seg=`<div class="seg">${[['list','목록'],['month','월'],['week','주']].map(m=>`<button class="${mode===m[0]?'on':''}" data-act="cal-mode" data-v="${m[0]}">${m[1]}</button>`).join('')}</div>`;
  let title,body,side='';const nar=narrow();
  const legend=`<div class="legend">${STLEG.map(([k,n])=>`<span class="lg st-${k}"><i></i>${n}</span>`).join('')}${S.who===S.me&&ovl().length?`<span style="opacity:.55">흐린 표시 = ${esc(ovl().map(nm).join(', '))}</span>`:''}</div>`;
  if(mode==='list'){
    title='앞으로 30일';const groups=[];
    for(let i=0;i<=30;i++){const k=addDays(TODAY,i);if(evm[k])groups.push([k,evm[k]])}
    body=`<div class="daylist">${groups.length?groups.map(([k,l])=>`<div><h4 class="${k===TODAY?'today':''}">${md(k)}${k===TODAY?' · 오늘':''}</h4><div class="list">${l.map(evRow).join('')}</div></div>`).join(''):'<div class="empty">앞으로 30일 동안 일정이 없어요</div>'}</div>`;
  }else{
    let cells=[];
    if(mode==='week'){const ws=weekStart(S.calSel);for(let i=0;i<7;i++)cells.push(addDays(ws,i));title=`${md(cells[0])} ~ ${md(cells[6])}`}
    else{const y=S.calY,mo=S.calM,first=new Date(y,mo,1),off=first.getDay(),dim=new Date(y,mo+1,0).getDate(),start=new Date(y,mo,1-off),rows=Math.ceil((off+dim)/7);
      for(let i=0;i<rows*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(iso(d))}title=`${y}년 ${mo+1}월`}
    if(mode==='week'&&nar){/* 휴대폰 주 보기: 요일별 세로 목록 */
      body=`<div class="weeklist">${cells.map(k=>{const ev=evm[k]||[];return `<div class="wrow ${k===TODAY?'today':''}"><div class="wday"><b>${WD[dt(k).getDay()]}</b><span class="num">${md(k).replace(/\(.\)/,'')}</span></div><div class="list">${ev.length?ev.map(evRow).join(''):'<span class="muted small">—</span>'}</div></div>`}).join('')}</div>${legend}`;
    }else{
      body=`<div class="grid7" style="grid-template-rows:auto repeat(${cells.length/7},minmax(0,1fr))">${WD.map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells.map(k=>{const ev=evm[k]||[];const oth=mode==='month'&&dt(k).getMonth()!==S.calM;
        return `<button class="cell ${oth?'other':''} ${k===TODAY?'today':''} ${k===S.calSel?'sel':''} ${mode==='week'?'week':''}" data-act="cal-day" data-v="${k}"><span class="n">${dt(k).getDate()}</span>${ev.map(x=>`<span class="ev k-${x.e.k} st-${EVC[x.e.k]||'start'} ${x.p.stage==='종료'?'st-end':''} ${x.w!==S.who?'p':''} ${nar&&mode==='month'?'':'go'}" ${nar&&mode==='month'?'':`data-act="open" data-id="${x.p.id}"`} title="${esc((x.w!==S.who?nm(x.w)+' · ':'')+COLNAME[x.p.stage]+' · '+(KIND[x.e.k]||KIND.etc)[1]+' · '+full(x.p))}">${nar&&mode==='month'?`<span class="tx">${esc(shortName(x.p))}</span>`:`<span class="tx">${x.p.type?`<span class="ty">[${esc(x.p.type)}]</span>`:''}<b>${esc(shortCo(x.p.co))}</b><span class="jb"> ${esc(x.p.job||shortRole(x.p.role))}</span></span>`}</span>`).join('')}</button>`}).join('')}</div>${legend}`;
    }
  }
  side=calSide(evm,mode,nar);
  const arrows=mode==='list'?'':`<button class="icon-btn" data-act="cal-prev" aria-label="이전">‹</button>`;
  const arrowsR=mode==='list'?'':`<button class="icon-btn" data-act="cal-next" aria-label="다음">›</button>`;
  const empty=!vis(S.who).length&&!ro()?`<div class="note info" style="margin-bottom:12px">아직 공고가 없어요. <b>+ 공고 추가</b>로 첫 공고를 넣어 보세요.</div>`:'';
  return `${roBanner()}${empty}<div class="view-head"><h2>${esc(nm(S.who))}의 달력</h2></div>
  <div class="cal-wrap"><div class="cal ${mode==='list'?'':'fill'}"><div class="cal-h">${seg}<span class="cal-nav">${arrows}<strong>${title}</strong>${arrowsR}</span><button class="btn sm" style="margin-left:auto" data-act="cal-today">오늘</button></div>${body}</div>${side}</div>`;
}

/* ================= S2 홈 ================= */
function homeHTML(){
  const w=S.who,posts=vis(w),all=tasksOf(w);
  const today=all.filter(x=>x.t.due&&diff(x.t.due)<=0&&(!x.t.done||x.t.doneAt===TODAY)).sort((a,b)=>(a.t.done-b.t.done)||a.t.due.localeCompare(b.t.due));
  const soon=all.filter(x=>!x.t.done&&x.t.due&&diff(x.t.due)>0&&diff(x.t.due)<=7).sort((a,b)=>a.t.due.localeCompare(b.t.due));
  const open=posts.filter(isOpen);
  const over=open.filter(p=>p.dueKind==='확정'&&p.due&&diff(p.due)<0).sort((a,b)=>a.due.localeCompare(b.due));
  const urg=open.filter(p=>p.dueKind==='확정'&&p.due&&diff(p.due)>=0&&diff(p.due)<=HOT_DAYS).sort((a,b)=>a.due.localeCompare(b.due));
  const unk=open.filter(p=>p.dueKind==='미확인');
  const up=[];posts.forEach(p=>(p.events||[]).forEach(e=>{const n=diff(e.d);if(n>=0&&n<=7)up.push({p,e,n})}));up.sort((a,b)=>a.n-b.n);
  const wait=posts.filter(p=>p.stage==='제출').sort((a,b)=>String(a.submitted).localeCompare(String(b.submitted)));
  const nc=newComments(w);
  const d=dt(TODAY);
  const taskRow=x=>{const n=diff(x.t.due);return `<div class="row ${x.t.done?'done':''}"><input type="checkbox" class="chk" data-ch="task" data-k="${x.key}" ${x.t.done?'checked':''} ${ro()?'disabled':''} aria-label="완료"><span class="grow"><div class="t">${esc(x.t.t)}${x.t.auto?' <span class="pill mute">자동</span>':''}</div><div class="s">${x.p?esc(shortCo(x.p.co))+' · ':''}${x.t.done?'오늘 완료':n<0?`<span class="late">${md(x.t.due)} 지남</span>`:n===0?'오늘':md(x.t.due)}</div></span>${x.p?`<button class="link-btn" data-act="open" data-id="${x.p.id}">공고 ›</button>`:''}</div>`};
  const left=today.filter(x=>!x.t.done).length;
  const tkH=(today.length?today.map(taskRow).join(''):`<div class="empty">오늘 기한인 할 일이 없어요</div>`)+(soon.length?`<div class="sub-h">다가오는 할 일</div>`+soon.map(taskRow).join(''):'')+(ro()?'':`<div class="inline"><input type="text" id="gtT" placeholder="공고와 상관없는 할 일 (예: 스터디 발표 준비)"><input type="date" id="gtD" value="${TODAY}" aria-label="기한"><button class="btn sm" data-act="add-gtask">추가</button></div>`);
  const ncH=nc.map(({p,c})=>`<div class="row click newc" role="button" tabindex="0" data-act="open-c" data-id="${p.id}" data-c="${esc(c.id)}"><span class="kind">💬</span><span class="grow"><div class="t">${esc(nm(c.by)||c.by)} · ${esc(label(p))}${c.qi>=0?` · ${c.qi+1}번`:' · 공고 댓글'}</div><div class="s oneline">${c.quote?'“'+esc(c.quote)+'” — ':''}${esc(c.text)}</div></span><span class="chev">›</span></div>`).join('');
  const overH=over.map(p=>{const n=diff(p.due);return `<div class="row click overdue" role="button" tabindex="0" data-act="open" data-id="${p.id}"><span class="dd urgent">${ddL(n)}</span><span class="grow"><div class="t oneline">${esc(label(p))}</div><div class="s"><span class="late">마감 지남 · 미제출</span> · ${md(p.due)} ${p.due.slice(11,16)}</div>${ro()?'':`<div class="acts"><button class="btn sm" data-act="od-sub" data-id="${p.id}">제출했음</button><button class="btn sm" data-act="od-ext" data-id="${p.id}">마감 연장</button><button class="btn sm" data-act="od-drop" data-id="${p.id}">포기</button></div>`}</span></div>`}).join('');
  const urgH=urg.map(p=>{const n=diff(p.due);return rowOpen(p.id,'',`<span class="dd ${ddC(n)}">${ddL(n)}</span><span class="grow"><div class="t oneline" title="${esc(full(p))}">${esc(label(p))}</div><div class="s">${COLNAME[p.stage]}${p.qs.length?` · 문항 ${p.qs.filter(q=>q.st==='제출본').length}/${p.qs.length}`:''} · ${md(p.due)} ${p.due.slice(11,16)}</div></span><span class="chev">›</span>`)}).join('');
  const unkH=unk.map(p=>rowOpen(p.id,'',`<span class="dd unk">미확인</span><span class="grow"><div class="t oneline">${esc(label(p))}</div><div class="s">${esc(dueText(p))}</div></span><span class="chev">›</span>`)).join('');
  const dueCnt=over.length+urg.length;
  const upH=up.length?up.map(({p,e})=>rowOpen(p.id,'',`<span class="kind">${(KIND[e.k]||KIND.etc)[0]}</span><span class="grow"><div class="t">${esc(e.t)}</div><div class="s oneline">${md(e.d)} · ${esc(label(p))}</div></span><span class="chev">›</span>`)).join(''):`<div class="empty">앞으로 7일 동안 잡힌 전형 일정이 없어요</div>`;
  const waitH=wait.length?wait.map(p=>rowOpen(p.id,'',`<span class="grow"><div class="t oneline">${esc(label(p))}</div><div class="s">${p.submitted?md(p.submitted)+' 제출 · '+(-diff(p.submitted))+'일째':'결과 대기'}</div></span><span class="chev">›</span>`)).join(''):`<div class="empty">결과를 기다리는 공고가 없어요</div>`;
  const pre=posts.filter(p=>p.stage==='관심').sort((a,b)=>String((a.dueKind==='확정'&&a.due)||'9999').localeCompare(String((b.dueKind==='확정'&&b.due)||'9999')));
  const partH=`<section class="sec"><h3>시작 전 <span class="count">${pre.length}</span></h3><div class="list">${pre.length?pre.map(p=>rowOpen(p.id,'',`<span class="grow"><div class="t oneline" title="${esc(full(p))}">${esc(label(p))}</div><div class="s">${esc(dueText(p))}</div></span><span class="chev">›</span>`)).join(''):'<div class="empty">시작 전 공고가 없어요</div>'}</div></section>`;
  return `${roBanner()}<div class="view-head"><h2>${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</h2><span class="muted">${esc(nm(w))} · 오늘 남은 할 일 ${left}개</span></div>
  <div class="home"><div class="stack">
   <section class="sec"><h3>오늘 할 일 <span class="count">${left}</span></h3><div class="list">${tkH}</div></section>
   ${nc.length?`<section class="sec"><h3>새 댓글 <span class="count">${nc.length}</span></h3><div class="list">${ncH}</div></section>`:''}
   <section class="sec"><h3>마감 임박 <span class="count">${dueCnt}</span></h3><div class="list">${dueCnt?overH+urgH:`<div class="empty">${HOT_DAYS}일 안에 마감되는 공고가 없어요</div>`}</div></section>
   <section class="sec"><h3>앞으로 7일 전형 일정 <span class="count">${up.length}</span></h3><div class="list">${upH}</div></section>
  </div><div class="stack">
   <section class="sec"><h3>결과 대기 <span class="count">${wait.length}</span></h3><div class="list">${waitH}</div></section>
   ${partH}
  </div></div>`;
}

/* ================= S3 보드 ================= */
function cardH(p){return `<article class="card" role="button" tabindex="0" ${ro()?'':'draggable="true"'} data-act="open" data-id="${p.id}"><div class="t oneline" title="${esc(p.co)}">${esc(shortCo(p.co))}</div><div class="s oneline" title="${esc(p.role)}">${esc(p.job||'')}${p.role?' · '+esc(shortRole(p.role)):''}${p.type?' · '+esc(p.type):''}</div><div class="m">${meta(p)}</div>${ro()?'':`<button class="btn sm mini" data-act="stage-menu" data-id="${p.id}">단계 변경 ›</button>`}</article>`}
function boardPosts(){let ps=vis(S.who);if(S.fInd)ps=ps.filter(p=>p.ind===S.fInd);if(S.fJob)ps=ps.filter(p=>p.job===S.fJob);const q=S.bQ.trim().toLowerCase();if(q)ps=ps.filter(p=>(p.co+' '+p.role+' '+p.job).toLowerCase().includes(q));return ps}
function sortList(l){return S.bSort==='upd'?l.sort((a,b)=>String(upd(b)).localeCompare(String(upd(a)))):l.sort((a,b)=>String((a.dueKind==='확정'&&a.due)||a.submitted||'9999').localeCompare(String((b.dueKind==='확정'&&b.due)||b.submitted||'9999')))}
function boardBody(){
  const posts=boardPosts();const by=s=>posts.filter(p=>p.stage===s);
  const tabs=COLS.map(c=>`<button class="${S.boardCol===c[0]?'on':''}" data-act="board-col" data-v="${c[0]}">${c[1]} ${by(c[0]).length}</button>`).join('');
  const cols=COLS.map(([k,name,v])=>{const list=by(k);let body;
    if(k==='종료'){body=RESULTS.map(r=>{const g=list.filter(p=>(p.result||'불합격')===r);if(!g.length)return '';const op=S.endOpen[r]||!!S.bQ.trim();return `<button class="grp" data-act="end-toggle" data-v="${r}"><span>${op?'▾':'▸'} ${r}</span><span class="count">${g.length}</span></button>${op?sortList(g).map(cardH).join(''):''}`}).join('')||'<div class="empty">없어요</div>'}
    else body=list.length?sortList(list).map(cardH).join(''):'<div class="empty">비어 있어요</div>';
    return `<div class="col ${list.length?'':'empty-col'}" data-col="${k}"><div class="col-h"><span class="dot" style="--c:var(${v})"></span>${name}<span class="count">${list.length}</span></div>${body}</div>`}).join('');
  return `<div class="board-wrap"><div class="board">${cols}</div></div>`;
}
function boardHTML(){
  return `${roBanner()}<div class="view-head"><h2>${esc(nm(S.who))}의 공고 보드</h2>${ro()?'':'<span class="muted small pc-only">카드를 끌어서 다른 칸에 놓으면 단계가 바뀌어요</span>'}</div>
  <div class="toolbar" style="margin-bottom:12px"><input class="search" id="bQ" type="search" placeholder="회사·직무 검색" value="${esc(S.bQ)}" aria-label="회사·직무 검색">
   <select data-ch="fjob" aria-label="직무 필터"><option value="">직무 전체</option>${DB[S.who].jobs.map(i=>`<option ${S.fJob===i?'selected':''}>${esc(i)}</option>`).join('')}</select>
   <select data-ch="find" aria-label="업권 필터"><option value="">업권 전체</option>${indsOf(S.who,S.fInd).map(i=>`<option ${S.fInd===i?'selected':''}>${esc(i)}</option>`).join('')}</select>
   <select data-ch="bsort" aria-label="정렬"><option value="due" ${S.bSort==='due'?'selected':''}>마감순</option><option value="upd" ${S.bSort==='upd'?'selected':''}>최근 수정순</option></select></div>
  <div id="boardBody">${boardBody()}</div>`;
}

/* ================= S7 기록 ================= */
const recDate=p=>p.submitted||String(p.due||'').slice(0,10)||p.created||'';
function inRange(p){const d=recDate(p);if(!S.recFrom&&!S.recTo)return true;if(!d)return false;return (!S.recFrom||d>=S.recFrom)&&(!S.recTo||d<=S.recTo)}
function recPreset(v){const t=dt(TODAY);S.recPreset=v;
  if(v==='all'){S.recFrom='';S.recTo=''}
  else if(v==='month'){S.recFrom=iso(new Date(t.getFullYear(),t.getMonth(),1));S.recTo=iso(new Date(t.getFullYear(),t.getMonth()+1,0))}
  else if(v==='3m'){S.recFrom=addDays(TODAY,-90);S.recTo=TODAY}
  else if(v==='year'){S.recFrom=t.getFullYear()+'-01-01';S.recTo=t.getFullYear()+'-12-31'}}
const jobKey=p=>p.job||'(미분류)',indKey=p=>p.ind||'(미분류)';
const isSub=p=>!!(p.submitted||(p.stage==='종료'&&p.result!=='포기/무응답'));
function recPass(p,skip){return inRange(p)&&(skip==='job'||!S.fJobs.length||S.fJobs.includes(jobKey(p)))&&(skip==='ind'||!S.fInds.length||S.fInds.includes(indKey(p)))}

/* ================= 기록: 전체 공고 표 (노션 표 보기처럼) ================= */
function LF0(){return {stage:'',type:'',res:'',ind:[],job:[],from:'',to:'',sub:false,fail:''}}
const STORD=Object.fromEntries(COLS.map((c,i)=>[c[0],i]));
function listPass(p){const f=S.lf,q=S.lq.trim().toLowerCase();
  if(q&&!(p.co+' '+p.role+' '+p.ind+' '+p.job+' '+p.type).toLowerCase().includes(q))return false;
  if(f.stage==='진행'&&p.stage==='종료')return false;
  if(f.stage==='제출전'&&!isOpen(p))return false;

  /* 직무별은 업권 조건만, 업권별은 직무 조건만 걸고 셈 → 다른 항목도 계속 고를 수 있게 */

     return `<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num hide-n">${g.d}</td><td class="num">${g.ok}</td><td><div class="rate ${few?'few':''}"><span class="track"><span class="fill" style="width:${r||0}%"></span></span><span class="num">${r===null?'-':r+'%'}</span>${few?'<span class="muted small">표본 적음</span>':''}</div></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">아직 없어요</td></tr>'}</tbody></table></div>`;

/* ================= S4 공고 상세 ================= */
function stepsH(p){const fi=p.stage==='종료'&&p.failAt?p.steps.indexOf(p.failAt):-1;
  return p.steps.map((s,i)=>{let c='';if(p.stage==='종료'){if(p.result==='최종합격'||i<fi)c='done';else if(i===fi)c='fail'}else{if(i<p.cur)c='done';else if(i===p.cur)c='now'}
    return (i?'<span class="arrow">→</span>':'')+`<span class="step ${c}">${c==='done'?'✔ ':c==='fail'?'✕ ':''}${esc(s)}</span>`}).join('')}
function hl(text,cs){
  let h=esc(text);const lost=[],placed=[],keys=[],byQ={};
  cs.filter(c=>c.quote&&!c.resolved).forEach(c=>{const q=esc(c.quote);
    if(byQ[q]){byQ[q].push(c.id);placed.push(c.id);return}
    const i=h.indexOf(q);if(i<0){lost.push(c.id);return}
    const seg=h.slice(i,i+q.length);if(h.lastIndexOf('<mark',i)>h.lastIndexOf('</mark>',i)||seg.includes('<mark')||seg.includes('</mark>'))return;
    byQ[q]=[c.id];placed.push(c.id);keys.push(q);
    h=h.slice(0,i)+`<mark data-act="pin-c" data-cs="§${keys.length-1}§">${q}</mark>`+h.slice(i+q.length)});
  h=h.replace(/§(\d+)§/g,(m,n)=>byQ[keys[+n]].join(' '));
  h=h.replace(/\n/g,'\n<i class="pg"></i>');/* 문단 사이 간격 */
  return {h,lost,placed};
}
function cmtH(p,c,lostIds){
  return `<div class="cmt ${c.resolved?'res':''} ${S.flash===c.id?'flash':''}" id="c-${esc(c.id)}">
   <div><span class="who">${esc(nm(c.by)||c.by||'노션')}</span> <span class="muted small">${md(c.at)}${c.ver?` · ${esc(c.ver)}에 단 댓글`:''}</span>${c.resolved?' <span class="pill mute">해결</span>':''}</div>
   ${c.quote?`<div class="q-quote">“${esc(c.quote)}”${lostIds.includes(c.id)?' <span class="lost">· 원래 문장 (지금은 수정됨)</span>':''}</div>`:''}
   <div style="white-space:pre-wrap">${esc(c.text)}</div>
   ${c.replies.map(r=>`<div class="rep"><span class="who">${esc(nm(r.by)||r.by)}</span> ${esc(r.text)}</div>`).join('')}
   ${S.replyTo===c.id?`<div class="inline"><input type="text" id="rTxt" placeholder="답글 입력"><button class="btn sm" data-act="reply-ok" data-c="${esc(c.id)}">등록</button></div>`:''}

    case 'reply':S.replyTo=S.replyTo===t.dataset.c?null:t.dataset.c;if(t.closest('#cpop')){const pp=document.getElementById('cpop');S.pin=(pp.dataset.ids||'').split(' ')[0]||S.pin}renderLayer();{const r=$('#rTxt');if(r)r.focus()}break;
    case 'reply-ok':if(p&&canComment(owner(p))){const c=p.comments.find(x=>x.id===t.dataset.c);const x=$('#rTxt').value.trim();if(c&&x){c.replies.push({id:uid(),text:x,by:S.me,at:TODAY});if(owner(p)!==S.me)c.read=false;dirtyC(p,c);S.replyTo=null;render()}}break;
    case 'resolve':if(p&&canComment(owner(p))){const c=p.comments.find(x=>x.id===t.dataset.c);if(c){c.resolved=!c.resolved;dirtyC(p,c);render();toast(c.resolved?'해결로 표시했어요':'다시 열었어요')}}break;
    case 'show-res':S.showRes[v]=!S.showRes[v];renderLayer();break;
    case 'board-col':S.boardCol=v;render();break;
    case 'goto-col':S.view='board';S.boardCol=v;render();{const el=document.querySelector('.col[data-col="'+v+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'})}break;
    case 'end-toggle':S.endOpen[v]=!S.endOpen[v];$('#boardBody').innerHTML=boardBody();break;
    case 'cal-prev':case 'cal-next':{const dir=a==='cal-next'?1:-1;if(S.calMode==='week'){S.calSel=addDays(S.calSel,7*dir);const d=dt(S.calSel);S.calY=d.getFullYear();S.calM=d.getMonth()}
      else{S.calM+=dir;if(S.calM<0){S.calM=11;S.calY--}if(S.calM>11){S.calM=0;S.calY++}}render();break}
    case 'cal-today':S.calSel=TODAY;S.calY=T0.getFullYear();S.calM=T0.getMonth();render();break;
    case 'cal-day':S.calSel=v;render();break;
    case 'cal-mode':S.calMode=v;render();break;
    case 'add-ev':if(p){const d=$('#evD').value,k=$('#evK').value,x=$('#evT').value.trim();if(!d||!x){toast('날짜와 내용을 넣어 주세요');break}p.events.push({id:uid(),d,k,t:x});hist(p,`일정 추가: ${x}`);dirty(p);render();toast('일정을 추가했어요')}break;
    case 'rm-pev':if(p){p.events=p.events.filter(e=>e.id!==t.dataset.e);dirty(p);render()}break;
    case 'add-task':if(p){const x=$('#tkT').value.trim(),d=$('#tkD').value;if(!x){toast('할 일을 적어 주세요');break}p.tasks.push({id:uid(),t:x,due:d,done:false});dirty(p);render();toast('할 일을 추가했어요')}break;
    case 'rm-task':if(p){p.tasks.splice(+t.dataset.i,1);dirty(p);render()}break;
    case 'add-gtask':{const x=$('#gtT').value.trim(),d=$('#gtD').value;if(!x){toast('할 일을 적어 주세요');break}DB[S.who].tasks.push({id:uid(),t:x,due:d,done:false});dirtyG(S.who);render();toast('할 일을 추가했어요');break}
    case 'del':S.delAsk=true;renderLayer();break;
    case 'del-no':S.delAsk=false;renderLayer();break;
    case 'del-yes':if(p){const w=owner(p),L=DB[w].posts;L.splice(L.indexOf(p),1);delRemote(p,w);S.open=null;S.delAsk=false;render();toast('삭제했어요')}break;
    case 'settings':if(S.me)settingsDlg();break;
    case 'job-del':{const L=DB[S.me].jobs,i=L.indexOf(v);if(i>=0&&L.length>1){L.splice(i,1);dirtyS(S.me);settingsDlg();toast(`'${v}'를 직무 선택지에서 뺐어요 (기존 공고는 그대로)`)}break}
    case 'job-add':{const x=$('#jobNew').value.trim();if(x&&!DB[S.me].jobs.includes(x)){DB[S.me].jobs.push(x);dirtyS(S.me);settingsDlg();toast('직무를 추가했어요')}break}
    case 'add':if(ro())break;S.open=null;
      if(S.addDraft){S.add=S.addDraft;S.addDraft=null;S.add.resumed=true;if(S.add.phase==='review'&&S.add.lastForm){S.form=S.add.lastForm;formDlg()}else{S.add.phase='input';addDlg()}}
      else{S.add={tab:'link',imgs:[],imgUrls:[],link:'',text:'',warn:'',phase:'input'};addDlg()}break;
    case 'add-new':S.add={tab:'link',imgs:[],imgUrls:[],link:'',text:'',warn:'',phase:'input'};S.form=null;addDlg();break;
    case 'add-tab':readAddInputs();S.add.tab=v;S.add.warn='';addDlg();break;
    case 'clear-img':S.add.imgs=[];S.add.imgUrls=[];addDlg();break;
    case 'add-img-url':{const el=$('#aImgUrl');addImgUrl(el?el.value:'');break}
    case 'paste-clip':pasteClip();break;
    case 'pick-pos':if(S.add&&S.add.res){const r=S.add.res;reviewFrom(S.add,r.d,r.url,r.d.positions[+v])}break;
    case 'pick-all':if(S.add){S.add.showAll=!S.add.showAll;addDlg()}break;
    case 'pick-back':if(S.add){S.add.phase='input';S.add.res=null;addDlg()}break;
    case 'extract':runExtract();break;
    case 'manual':readAddInputs();S.form={mode:'manual',v:Object.assign(BLANK(),{link:S.add.link||''})};S.add.lastForm=S.form;S.add.phase='review';formDlg();break;
    case 'form-back':syncForm();if(S.add){S.add.lastForm=S.form;S.add.phase='input';S.form=null;S.add.resumed=false;addDlg()}break;
    case 'to-form':S.form=S.add.lastForm;S.add.phase='review';formDlg();break;
    case 'rm-ev':syncForm();S.form.v.events.splice(+t.dataset.i,1);formDlg();break;
    case 'rm-q':syncForm();S.form.v.qs.splice(+t.dataset.i,1);formDlg();break;
    case 'q-add':syncForm();S.form.v.qs.push({t:'',n:0});formDlg();break;
    case 'form-save':saveForm();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.dlg)closeDlg();else if(S.open){S.open=null;S.editQ=null;render()}return}
  if(e.key==='Enter'&&e.target.id==='shEm'){e.preventDefault();const b=document.querySelector('[data-act="sh-add"]');if(b)b.click();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  const el=e.target,c=el.dataset.ch;
  if(el.dataset&&(el.dataset.qw||el.dataset.qm)){qKeep(el);return}
  if(el.dataset&&el.dataset.qf==='u'&&S.ed&&el.closest('.sheet')){syncEd();const q=S.ed.v.qs[+el.dataset.q],ta=document.querySelector('.sheet [data-q="'+el.dataset.q+'"][data-qf="a"]'),c2=document.querySelector('[data-cnt="'+el.dataset.q+'"]');if(q&&c2){const a=ta?ta.value:q.a;c2.textContent=qCnt(q,a);c2.classList.toggle('over',qOver(q,a))}return}
  if(el.dataset.auto){DB[S.me].auto[el.dataset.auto]=el.checked;dirtyS(S.me);toast(el.checked?'자동 할 일을 켰어요':'자동 할 일을 껐어요');return}
  if(el.id==='aImg'){addFiles(el.files);return}
  if((el.dataset.f==='dueKind'||el.dataset.f==='job')&&S.ed&&el.closest('.sheet')){syncEd();renderLayer();return}
  if(el.dataset.f==='dueKind'||el.dataset.f==='job'){syncForm();formDlg();return}
  if(!c)return;const p=S.open?find(S.open):null;
  if(c==='task'){const k=el.dataset.k.split(':');let tk;if(k[0]==='g'){tk=DB[k[1]].tasks[+k[2]]}else{const q=find(k[0]);tk=q.tasks[+k[1]]}
    tk.done=el.checked;tk.doneAt=el.checked?TODAY:'';if(k[0]==='g')dirtyG(k[1]);else dirty(find(k[0]));render();if(el.checked){S.undoTask=el.dataset.k;toast('완료했어요',true,'undo-task')}}
  if(c==='stage'&&p)setStage(p,el.value);
  if(c==='qst'&&p){const q=p.qs[+el.dataset.i];q.st=el.value;q.lock=el.value==='제출본';dirty(p);render();if(q.lock)toast('제출본으로 잠갔어요')}
  if(c==='find'){S.fInd=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='fjob'){S.fJob=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='bsort'){S.bSort=el.value;$('#boardBody').innerHTML=boardBody()}
  if(c==='ovl'){const a=LS.get('ovl',[]).filter(x=>x!==el.dataset.v);if(el.checked)a.push(el.dataset.v);LS.set('ovl',a);render();toast(el.checked?`${nm(el.dataset.v)} 님 일정을 내 달력에 같이 보여 줘요`:`${nm(el.dataset.v)} 님 일정을 내 달력에서 뺐어요`)}
  if(c==='recFrom'||c==='recTo'){S[c]=el.value;S.recPreset='custom';render()}
  if(c==='lstage'){S.lf.stage=el.value;if(el.value==='제출전'){S.lSort='due';S.lDir=1}render()}
  if(c==='ltype'){S.lf.type=el.value;render()}
  if(c==='lres'){S.lf.res=el.value;render()}
  if(c==='lind'){S.lf.ind=el.value?[el.value]:[];render()}
  if(c==='ljob'){S.lf.job=el.value?[el.value]:[];render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&(el.dataset.qw||el.dataset.qm)){qKeep(el);return}
  if(el.id==='fLink'||el.id==='fRel'||el.id==='aLink'){const m=el.parentNode.querySelector('.bad-url');if(m)m.hidden=!el.value.trim()||okUrl(el.value)}
  if(el.id==='lQ'){S.lq=el.value;const r=listRows();$('#listBody').innerHTML=r.h;$('#listCnt').textContent=r.n+'건'}
  if(el.id==='bQ'){S.bQ=el.value;$('#boardBody').innerHTML=boardBody()}
  if(el.dataset&&el.dataset.qf==='a'&&S.ed&&el.closest('.sheet')){const q=S.ed.v.qs[+el.dataset.q];const c=document.querySelector('[data-cnt="'+el.dataset.q+'"]');if(c&&q){c.textContent=qCnt(q,el.value);c.classList.toggle('over',qOver(q,el.value))}}
  if(el.id==='ansTa'){const p=find(S.open),q=p&&p.qs[S.editQ.qi];const c=$('#ansCnt');if(c&&q){c.textContent=qCnt(q,el.value);c.classList.toggle('over',qOver(q,el.value))}}
  if(el.dataset&&el.dataset.f){const f=el.closest('.field');if(f&&String(el.value).trim())f.classList.remove('missing');
    if(el.dataset.f==='co'&&S.form&&S.form.mode!=='edit'){const n=$('#dupNote');if(n)n.innerHTML=dupH(el.value,S.form.id)}}
});
document.addEventListener('mouseover',e=>{if(narrow()||!e.target.closest)return;const m=e.target.closest('mark[data-cs]');
  if(m&&!S.pin){clearTimeout(popT);popT=setTimeout(()=>showPop(m,false),120)}else if(e.target.closest('#cpop'))clearTimeout(popT)});
document.addEventListener('mouseout',e=>{if(S.pin||!e.target.closest)return;if(!e.target.closest('mark[data-cs],#cpop'))return;const to=e.relatedTarget;
  if(to&&to.closest&&to.closest('mark[data-cs],#cpop'))return;clearTimeout(popT);popT=setTimeout(()=>{if(!S.pin)hidePop()},250)});
document.addEventListener('scroll',()=>{const el=document.getElementById('cpop');if(!el||el.hidden||narrow())return;if(S.pin){const m=markFor(S.pin);if(m)showPop(m,true)}else hidePop()},true);
document.addEventListener('selectionchange',()=>{
  const bar=$('#selbar');if(!bar)return;
  const sel=window.getSelection&&window.getSelection();const txt=sel?String(sel).trim():'';
  const node=sel&&sel.anchorNode;const el=node&&(node.nodeType===1?node:node.parentElement);const box=el&&el.closest&&el.closest('.ans');
  let qt=txt;if(qt&&box){const pp=find(box.dataset.pid),qq=pp&&pp.qs[+box.dataset.qi];if(qq&&!qq.a.includes(qt)){const t2=qt.replace(/\n\s*\n/g,'\n');if(qq.a.includes(t2))qt=t2}}
  if(txt&&box&&!box.classList.contains('empty-a')&&txt.length<=300){S.sel={qi:+box.dataset.qi,quote:qt};$('#selTxt').textContent=`“${txt}”`;bar.hidden=false}
  else if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.selbar')))bar.hidden=true;
});
document.addEventListener('paste',e=>{if(!S.add||S.add.phase!=='input'||S.add.tab!=='cap')return;const cd=e.clipboardData||{};
  const fs=[...(cd.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  const inBox=e.target&&e.target.closest&&e.target.closest('.paste-box');
  if(fs.length){e.preventDefault();addFiles(fs);return}
  const txt=cd.getData?cd.getData('text/plain'):'';
  if(e.target&&e.target.id==='aImgUrl')return;
  if(isUrl(txt)&&(inBox||!(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)))){e.preventDefault();addImgUrl(txt);return}
  if(inBox){e.preventDefault();toast('복사한 이미지가 없어요')}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card[draggable]');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&!ro()){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();col.classList.remove('over');const p=find(e.dataTransfer.getData('text/plain'));if(p&&canEdit(owner(p))&&!ro())setStage(p,col.dataset.col)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me){const t=iso(new Date());if(t!==TODAY){TODAY=t;T0=new Date(TODAY+'T00:00:00')}refresh(true)}});
setInterval(()=>{if(document.visibilityState==='visible'&&S.me)refresh(true)},90000);
window.addEventListener('beforeunload',e=>{if(queue.size||saving){e.preventDefault();e.returnValue=''}});

/* ================= 시작 ================= */
const cached=LS.get('cache',null);
if(cfg.sess&&cached&&cached.meta&&cached.email===cfg.email){try{setData(cached.data,cached.meta);raw=cached.data}catch(e){}}
if(cfg.sess&&loaded&&META.me){enterMine();refresh(true)}
else if(cfg.sess){S.busy=true;render();api('loadAll').then(j=>{applyLoad(j);S.busy=false;enterMine()}).catch(e=>{S.busy=false;if(e.code!=='auth'){S.loginErr=errMsg(e);render()}})}
else render();
})();
</script>
